<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seventh Avenue Physio - Wellness Portal</title>
    <style>
        :root {
            --primary: #00796b;
            --primary-dark: #004d40;
            --accent: #25d366;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--primary-dark);
            margin-bottom: 5px;
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .slot-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .slot-time {
            font-weight: bold;
            color: var(--primary-dark);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .btn-import {
            background-color: #1a73e8;
            width: 100%;
            margin-bottom: 15px;
            padding: 10px;
        }

        .btn-import:hover {
            background-color: #1557b0;
        }

        /* Modal Overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
        }

        .modal-header {
            margin-top: 0;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #888;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .btn-whatsapp {
            background-color: var(--accent);
            width: 100%;
            padding: 12px;
            font-size: 16px;
        }

        .btn-whatsapp:hover {
            background-color: #1da851;
        }

        #csvFileInput {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Seventh Avenue Physio</h1>
            <p>Appointment & Wellness Portal</p>
        </header>

        <h2>Available Slots</h2>
        <div class="schedule-grid" id="slotsContainer">
            <div class="slot-card">
                <div>
                    <div class="slot-time">08:00 AM</div>
                    <small>Today</small>
                </div>
                <button class="btn" onclick="openBookingModal('08:00 AM')">+ Book</button>
            </div>
            <div class="slot-card">
                <div>
                    <div class="slot-time">09:30 AM</div>
                    <small>Today</small>
                </div>
                <button class="btn" onclick="openBookingModal('09:30 AM')">+ Book</button>
            </div>
            <div class="slot-card">
                <div>
                    <div class="slot-time">11:00 AM</div>
                    <small>Today</small>
                </div>
                <button class="btn" onclick="openBookingModal('11:00 AM')">+ Book</button>
            </div>
            <div class="slot-card">
                <div>
                    <div class="slot-time">02:00 PM</div>
                    <small>Today</small>
                </div>
                <button class="btn" onclick="openBookingModal('02:00 PM')">+ Book</button>
            </div>
        </div>
    </div>

    <!-- Booking Modal -->
    <div class="modal-overlay" id="bookingModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Book Appointment</h3>
                <button class="close-btn" onclick="closeBookingModal()">&times;</button>
            </div>

            <!-- Import Google Contacts CSV Button -->
            <button class="btn btn-import" onclick="triggerCSVUpload()">📥 Import Google Contacts CSV</button>
            <input type="file" id="csvFileInput" accept=".csv" onchange="handleCSVFileSelect(event)">

            <form id="bookingForm" onsubmit="confirmBooking(event)">
                <div class="form-group">
                    <label for="slotTime">Selected Slot</label>
                    <input type="text" id="slotTime" readonly>
                </div>

                <div class="form-group">
                    <label for="patientName">Patient Full Name</label>
                    <input type="text" id="patientName" list="contactsDatalist" placeholder="Start typing patient name..." required autocomplete="off">
                    <datalist id="contactsDatalist"></datalist>
                </div>

                <div class="form-group">
                    <label for="patientPhone">WhatsApp Number</label>
                    <input type="tel" id="patientPhone" placeholder="e.g. 263777203606" required>
                </div>

                <div class="form-group">
                    <label for="practitionerName">Practitioner</label>
                    <input type="text" id="practitionerName" value="Chido" required>
                </div>

                <button type="submit" class="btn btn-whatsapp">Send WhatsApp Confirmation</button>
            </form>
        </div>
    </div>

    <script>
        // Load stored contacts from browser local storage
        let contactsMap = JSON.parse(localStorage.getItem("saved_patient_contacts") || "{}");

        document.addEventListener("DOMContentLoaded", () => {
            refreshContactsDatalist();

            // Auto-fill phone when typing/selecting a patient name
            const nameInput = document.getElementById("patientName");
            if (nameInput) {
                nameInput.addEventListener("input", (e) => {
                    const val = e.target.value.trim();
                    if (contactsMap[val]) {
                        document.getElementById("patientPhone").value = contactsMap[val];
                    }
                });
            }
        });

        function refreshContactsDatalist() {
            const datalist = document.getElementById("contactsDatalist");
            if (!datalist) return;
            datalist.innerHTML = "";
            Object.keys(contactsMap).forEach(name => {
                const option = document.createElement("option");
                option.value = name;
                datalist.appendChild(option);
            });
        }

        function triggerCSVUpload() {
            document.getElementById("csvFileInput").click();
        }

        function handleCSVFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                parseGoogleCSV(e.target.result);
            };
            reader.readAsText(file);
        }

        function parseGoogleCSV(csvText) {
            const lines = csvText.split(/\r\n|\n/);
            if (lines.length < 2) {
                alert("The CSV file appears to be empty.");
                return;
            }

            // Correctly parse CSV rows preserving quoted text
            function parseCSVLine(line) {
                const result = [];
                let cur = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        result.push(cur.trim());
                        cur = '';
                    } else {
                        cur += char;
                    }
                }
                result.push(cur.trim());
                return result.map(val => val.replace(/^"|"$/g, '').trim());
            }

            const headers = parseCSVLine(lines[0]).map(h => h.toLowerCase());

            // Locate Google Contacts name and phone headers
            let nameIdx = headers.findIndex(h => h === 'name' || h === 'given name');
            let phoneIdx = headers.findIndex(h => h.includes('phone 1 - value') || h.includes('phone number') || h.includes('phone 1'));

            if (nameIdx === -1) nameIdx = 0;

            let addedCount = 0;
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const row = parseCSVLine(lines[i]);

                if (row.length > nameIdx) {
                    const rawName = row[nameIdx] || "";
                    let rawPhone = (phoneIdx !== -1 && row[phoneIdx]) ? row[phoneIdx] : "";

                    // Fallback search across columns if phone column is missing or empty
                    if (!rawPhone) {
                        for (let c = 0; c < row.length; c++) {
                            if (headers[c] && headers[c].includes('phone') && row[c]) {
                                rawPhone = row[c];
                                break;
                            }
                        }
                    }

                    if (rawName) {
                        // Clean non-numeric characters from phone numbers
                        const cleanPhone = rawPhone.replace(/[^\d+]/g, '');
                        contactsMap[rawName] = cleanPhone;
                        addedCount++;
                    }
                }
            }

            // Persist into localStorage
            try {
                localStorage.setItem("saved_patient_contacts", JSON.stringify(contactsMap));
            } catch (e) {
                console.error("LocalStorage save failed:", e);
            }

            refreshContactsDatalist();
            alert(`Successfully imported ${addedCount} contacts with phone numbers!`);
        }

        function openBookingModal(timeSlot) {
            document.getElementById("slotTime").value = timeSlot;
            document.getElementById("bookingModal").classList.add("active");
        }

        function closeBookingModal() {
            document.getElementById("bookingModal").classList.remove("active");
        }

        function confirmBooking(event) {
            event.preventDefault();
            const slot = document.getElementById("slotTime").value;
            const name = document.getElementById("patientName").value.trim();
            const rawPhone = document.getElementById("patientPhone").value.trim();
            const practitioner = document.getElementById("practitionerName").value.trim();

            const cleanPhone = rawPhone.replace(/[^\d]/g, '');
            const todayDate = new Date().toISOString().split('T')[0];

            const message = `Hello ${name}, your appointment with ${practitioner} is confirmed for ${todayDate} at ${slot}. - Seventh Avenue Physio`;
            const waUrl = `https://api.whatsapp.com/send/?phone=${cleanPhone}&text=${encodeURIComponent(message)}&type=phone_number&app_absent=0`;

            window.open(waUrl, '_blank');
            closeBookingModal();
        }
    </script>
</body>
</html>
