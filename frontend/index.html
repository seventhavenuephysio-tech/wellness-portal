<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellness Booking Portal</title>
    
    <!-- PWA & Theme Support -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#27ae60">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: #27ae60;
            margin-bottom: 5px;
        }

        .date-picker-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            background: #e8f8f5;
            padding: 12px;
            border-radius: 8px;
        }

        .date-picker-container label {
            font-weight: bold;
            color: #2c3e50;
        }

        .date-picker-container input {
            padding: 8px 12px;
            border: 1px solid #27ae60;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #e0e0e0;
            padding: 12px;
            text-align: center;
            vertical-align: middle;
        }

        th {
            background-color: #27ae60;
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        .time-col {
            background-color: #f8f9fa;
            width: 20%;
        }

        .slot-cell {
            height: 75px;
            transition: background-color 0.2s;
        }

        .slot-cell.available {
            background-color: #ffffff;
        }

        .slot-cell.booked {
            background-color: #e8f8f5;
            border-left: 4px solid #27ae60;
        }

        /* Editable Base Slot Time Styling */
        .editable-time {
            display: inline-block;
            font-weight: bold;
            color: #2c3e50;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            border: 1px dashed #27ae60;
            background-color: #ffffff;
        }

        .editable-time:hover {
            background-color: #e8f8f5;
        }

        .editable-time:focus {
            background-color: #ffffff;
            outline: 2px solid #27ae60;
            border-style: solid;
        }

        .book-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            display: block;
            margin: 0 auto;
            transition: background-color 0.2s;
        }

        .book-btn:hover {
            background-color: #219150;
        }

        .booked-info {
            color: #2c3e50;
            font-size: 0.95rem;
            line-height: 1.3;
        }

        .booked-info strong {
            color: #27ae60;
        }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            th, td { padding: 8px; font-size: 0.85rem; }
            .book-btn { padding: 6px 10px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Seventh Avenue Physio</h1>
            <p>Wellness Booking Portal</p>
        </header>

        <div class="date-picker-container">
            <label for="diaryDate">Select Date:</label>
            <input type="date" id="diaryDate" onchange="fetchAndRenderBookings()">
        </div>

        <table>
            <thead>
                <tr>
                    <th class="time-col">Base Slot</th>
                    <th>Chido</th>
                    <th>Mispar</th>
                    <th>Tinotenda</th>
                </tr>
            </thead>
            <tbody id="scheduleBody">
                <!-- Grid renders dynamically via JS -->
            </tbody>
        </table>
    </div>

    <script>
        const API_BASE_URL = "https://wellness-portal-7qny.onrender.com";
        const therapists = ["Chido", "Mispar", "Tinotenda"];
        const timeSlots = [
            "08:00 AM", "09:00 AM", "10:00 AM", "11:00 AM", 
            "12:00 PM", "01:00 PM", "02:00 PM", "03:00 PM", "04:00 PM"
        ];

        document.addEventListener("DOMContentLoaded", () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById("diaryDate").value = today;
            
            // 1. Render base grid immediately
            renderBaseGrid();
            
            // 2. Fetch existing bookings from database
            fetchAndRenderBookings();
        });

        function cleanDateString(dateStr) {
            return dateStr.trim();
        }

        function renderBaseGrid() {
            const tbody = document.getElementById("scheduleBody");
            tbody.innerHTML = "";

            timeSlots.forEach((defaultTime, index) => {
                const row = document.createElement("tr");

                // Editable Base Time Column
                const timeTd = document.createElement("td");
                timeTd.className = "time-col";
                const baseTimeId = `base-time-${index}`;
                timeTd.innerHTML = `
                    <span contenteditable="true" id="${baseTimeId}" class="editable-time" title="Click to edit slot time">${defaultTime}</span>
                `;
                row.appendChild(timeTd);

                // Therapist Columns
                therapists.forEach(therapist => {
                    const slotTd = document.createElement("td");
                    slotTd.id = `slot-${therapist}-${index}`;
                    slotTd.className = "slot-cell available";
                    slotTd.innerHTML = `
                        <button class="book-btn" onclick="bookSlot('${therapist}', ${index})">BOOK</button>
                    `;
                    row.appendChild(slotTd);
                });

                tbody.appendChild(row);
            });
        }

        async function fetchAndRenderBookings() {
            const diaryDate = document.getElementById("diaryDate").value;
            const cleanDate = cleanDateString(diaryDate);

            // Re-render clean base grid first
            renderBaseGrid();

            try {
                const response = await fetch(`${API_BASE_URL}/api/bookings?date=${cleanDate}`);
                if (!response.ok) return;

                const bookings = await response.json();
                if (!Array.isArray(bookings)) return;

                // Overlay booked slots
                therapists.forEach(therapist => {
                    timeSlots.forEach((defaultTime, index) => {
                        const slotCell = document.getElementById(`slot-${therapist}-${index}`);
                        if (!slotCell) return;

                        // Match booking to the base hour slot window
                        const existingBooking = bookings.find(b => 
                            b.therapist === therapist && 
                            b.time && 
                            b.time.substring(0, 2) === defaultTime.substring(0, 2)
                        );

                        if (existingBooking) {
                            slotCell.className = "slot-cell booked";
                            slotCell.innerHTML = `
                                <div class="booked-info">
                                    <strong>${existingBooking.time}</strong><br>
                                    ${existingBooking.patientName}
                                </div>
                            `;
                        }
                    });
                });
            } catch (error) {
                console.error("Error fetching bookings:", error);
            }
        }

        async function bookSlot(therapist, index) {
            const date = cleanDateString(document.getElementById("diaryDate").value);
            const timeSpan = document.getElementById(`base-time-${index}`);
            const actualTime = timeSpan ? timeSpan.innerText.trim() : "";

            if (!actualTime) {
                alert("Please enter a valid start time.");
                return;
            }

            const patientName = prompt(`Enter patient name for ${therapist} at ${actualTime}:`);
            if (!patientName) return;

            const patientPhone = prompt(`Enter WhatsApp number with country code (e.g. +263771234567):`);

            try {
                const response = await fetch(API_BASE_URL + "/api/bookings", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        therapist, 
                        time: actualTime, 
                        date, 
                        patientName, 
                        patientPhone 
                    })
                });

                if (response.ok) {
                    if (patientPhone) {
                        const cleanPhone = patientPhone.replace(/[^0-9]/g, '');
                        const message = `Hello ${patientName}, your appointment with ${therapist} is confirmed for ${date} at ${actualTime}. - Seventh Avenue Physio`;
                        window.location.href = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`;
                    } else {
                        alert(`Booking saved for ${actualTime}!`);
                        fetchAndRenderBookings();
                    }
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    alert(`Booking failed: ${errorData.error || 'Server error'}`);
                }
            } catch (error) {
                console.error("Error saving booking:", error);
                alert("Server error when attempting to book.");
            }
        }

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log("Service Worker Registered Successfully"))
            .catch((err) => console.log("Service Worker Failed", err));
        }
    </script>
</body>
</html>
