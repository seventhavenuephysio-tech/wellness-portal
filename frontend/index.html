<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Wellness Booking Portal</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#27ae60">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: #27ae60;
            margin-bottom: 5px;
        }

        .status-banner {
            text-align: center;
            font-size: 0.85rem;
            color: #555;
            background: #f0f0f0;
            padding: 6px;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .date-picker-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            background: #e8f8f5;
            padding: 12px;
            border-radius: 8px;
        }

        .date-picker-container label {
            font-weight: bold;
            color: #2c3e50;
        }

        .date-picker-container input {
            padding: 8px 12px;
            border: 1px solid #27ae60;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #e0e0e0;
            padding: 12px;
            text-align: center;
            vertical-align: middle;
        }

        th {
            background-color: #27ae60;
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        .time-col {
            background-color: #f8f9fa;
            font-weight: bold;
            color: #7f8c8d;
            width: 18%;
        }

        .slot-cell {
            height: 75px;
            transition: background-color 0.2s;
        }

        .slot-cell.available {
            background-color: #ffffff;
        }

        .slot-cell.booked {
            background-color: #e8f8f5;
            border-left: 4px solid #27ae60;
        }

        .book-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            display: block;
            margin: 0 auto;
            transition: background-color 0.2s;
        }

        .book-btn:hover {
            background-color: #219150;
        }

        .booked-info {
            color: #2c3e50;
            font-size: 0.95rem;
            line-height: 1.3;
        }

        .booked-info strong {
            color: #27ae60;
        }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            th, td { padding: 8px; font-size: 0.85rem; }
            .book-btn { padding: 6px 10px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Seventh Avenue Physio</h1>
            <p>Wellness Booking Portal</p>
        </header>

        <div id="statusBanner" class="status-banner">Connecting to server...</div>

        <div class="date-picker-container">
            <label for="diaryDate">Select Date:</label>
            <input type="date" id="diaryDate" onchange="fetchAndRenderBookings()">
        </div>

        <table>
            <thead>
                <tr>
                    <th class="time-col">Base Slot</th>
                    <th>Chido</th>
                    <th>Mispar</th>
                    <th>Tinotenda</th>
                </tr>
            </thead>
            <tbody id="scheduleBody">
                <!-- Grid renders dynamically via JS -->
            </tbody>
        </table>
    </div>

    <script>
        const API_BASE_URL = "https://wellness-portal-backend.onrender.com";
        const therapists = ["Chido", "Mispar", "Tinotenda"];
        const timeSlots = [
            "08:00 AM", "09:00 AM", "10:00 AM", "11:00 AM", 
            "12:00 PM", "01:00 PM", "02:00 PM", "03:00 PM", "04:00 PM"
        ];

        document.addEventListener("DOMContentLoaded", () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById("diaryDate").value = today;
            
            renderBaseGrid();
            fetchAndRenderBookings();
        });

        window.addEventListener("focus", () => {
            fetchAndRenderBookings();
        });

        function updateStatus(msg) {
            const banner = document.getElementById("statusBanner");
            if (banner) banner.innerText = msg;
        }

        function datesMatch(d1, d2) {
            if (!d1 || !d2) return false;
            const s1 = String(d1).trim().replace(/\//g, '-').split('T')[0];
            const s2 = String(d2).trim().replace(/\//g, '-').split('T')[0];
            if (s1 === s2) return true;

            const parts1 = s1.split('-');
            const parts2 = s2.split('-');
            if (parts1.length === 3 && parts2.length === 3) {
                if (parts1[0] === parts2[2] && parts1[1] === parts2[1] && parts1[2] === parts2[0]) return true;
            }
            return false;
        }

        function parseHour(timeStr) {
            if (!timeStr) return -1;
            const match = String(timeStr).trim().toUpperCase().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i);
            if (!match) return -1;
            let hour = parseInt(match[1], 10);
            const period = match[3];
            if (period === "PM" && hour < 12) hour += 12;
            if (period === "AM" && hour === 12) hour = 0;
            return hour;
        }

        function renderBaseGrid() {
            const tbody = document.getElementById("scheduleBody");
            tbody.innerHTML = "";

            timeSlots.forEach((defaultTime, index) => {
                const row = document.createElement("tr");

                // Static Base Hour Label
                const timeTd = document.createElement("td");
                timeTd.className = "time-col";
                timeTd.innerText = defaultTime;
                row.appendChild(timeTd);

                // Therapist Columns
                therapists.forEach(therapist => {
                    const slotTd = document.createElement("td");
                    slotTd.id = `slot-${therapist}-${index}`;
                    slotTd.className = "slot-cell available";
                    slotTd.innerHTML = `
                        <button class="book-btn" onclick="bookSlot('${therapist}', '${defaultTime}')">BOOK</button>
                    `;
                    row.appendChild(slotTd);
                });

                tbody.appendChild(row);
            });
        }

        async function fetchAndRenderBookings() {
            const diaryDate = document.getElementById("diaryDate").value;
            updateStatus(`Loading bookings for ${diaryDate}...`);

            renderBaseGrid();

            try {
                const response = await fetch(`${API_BASE_URL}/api/bookings?date=${diaryDate}&t=${Date.now()}`);
                if (!response.ok) {
                    updateStatus(`Server response error: ${response.status}`);
                    return;
                }

                const rawData = await response.json();
                const bookingsList = Array.isArray(rawData) 
                    ? rawData 
                    : (rawData.bookings || rawData.data || []);

                updateStatus(`Server connected! Total bookings: ${bookingsList.length}`);

                therapists.forEach(therapist => {
                    timeSlots.forEach((defaultTime, index) => {
                        const slotCell = document.getElementById(`slot-${therapist}-${index}`);
                        if (!slotCell) return;

                        const slotHour = parseHour(defaultTime);

                        const existingBooking = bookingsList.find(b => {
                            if (!b || !b.therapist || !b.time) return false;

                            const sameTherapist = String(b.therapist).trim().toLowerCase() === therapist.trim().toLowerCase();
                            if (!sameTherapist) return false;

                            if (b.date && !datesMatch(b.date, diaryDate)) return false;

                            const bookingHour = parseHour(b.time);
                            return bookingHour !== -1 && bookingHour === slotHour;
                        });

                        if (existingBooking) {
                            const name = existingBooking.patientName || existingBooking.patient_name || existingBooking.name || 'Booked';
                            slotCell.className = "slot-cell booked";
                            slotCell.innerHTML = `
                                <div class="booked-info">
                                    <strong>${existingBooking.time}</strong><br>
                                    ${name}
                                </div>
                            `;
                        }
                    });
                });
            } catch (error) {
                console.error("Error fetching bookings:", error);
                updateStatus("Error connecting to database server.");
            }
        }

        async function bookSlot(therapist, defaultTime) {
            const date = document.getElementById("diaryDate").value;

            // Step 1: Prompt staff to confirm or change start time
            const actualTime = prompt(`Confirm or edit appointment start time for ${therapist}:`, defaultTime);
            if (!actualTime) return; // Cancelled

            // Step 2: Patient Name
            const patientName = prompt(`Enter patient name for ${therapist} at ${actualTime}:`);
            if (!patientName) return; // Cancelled

            // Step 3: WhatsApp Number
            const patientPhone = prompt(`Enter WhatsApp number with country code (e.g. +263771234567):`);

            const payload = { 
                therapist, 
                time: actualTime.trim(), 
                date, 
                patientName: patientName.trim(), 
                patient_name: patientName.trim(),
                name: patientName.trim(),
                patientPhone: patientPhone ? patientPhone.trim() : "",
                phone: patientPhone ? patientPhone.trim() : ""
            };

            updateStatus("Saving booking to database...");

            try {
                const response = await fetch(`${API_BASE_URL}/api/bookings`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert(`Booking saved for ${actualTime}!`);
                    await fetchAndRenderBookings();

                    if (patientPhone) {
                        const cleanPhone = patientPhone.replace(/[^0-9]/g, '');
                        const message = `Hello ${patientName}, your appointment with ${therapist} is confirmed for ${date} at ${actualTime}. - Seventh Avenue Physio`;
                        window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`, '_blank');
                    }
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    alert(`Booking failed: ${errorData.error || errorData.message || 'Server error'}`);
                    updateStatus("Booking failed.");
                }
            } catch (error) {
                console.error("Error saving booking:", error);
                alert("Server error when attempting to book.");
                updateStatus("Server error.");
            }
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log("Service Worker Registered"))
            .catch((err) => console.log("Service Worker Failed", err));
        }
    </script>
</body>
</html>
