<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Seventh Avenue Physio - Booking Portal</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f766e">

    <!-- Premium Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0f766e;
            --primary-hover: #0d9488;
            --primary-light: #f0fdf4;
            --primary-soft: #d1fae5;
            --accent: #10b981;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --danger-light: #fef2f2;
            --bg-body: #f1f5f9;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-subtle: #e2e8f0;
            --border-hover: #cbd5e1;
            --radius-card: 16px;
            --radius-button: 10px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
            --shadow-modal: 0 20px 25px -5px rgba(15, 23, 42, 0.2), 0 8px 10px -6px rgba(15, 23, 42, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 40px 20px;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .portal-wrapper {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Top Navigation Header */
        header {
            background: var(--surface);
            padding: 24px 32px;
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 24px;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #0f766e, #10b981);
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(15, 118, 110, 0.3);
        }

        .brand-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        /* Live Status Indicator */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #334155;
            background: #f8fafc;
            padding: 8px 14px;
            border-radius: 30px;
            border: 1px solid var(--border-subtle);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.25);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Date Switcher Input */
        .date-picker-group {
            display: flex;
            align-items: center;
            background: #f8fafc;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-button);
            padding: 4px 12px;
            transition: all 0.2s;
        }

        .date-picker-group:hover {
            border-color: var(--border-hover);
            background: #ffffff;
        }

        .date-picker-group label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-right: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .date-picker-group input[type="date"] {
            border: none;
            background: transparent;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-main);
            outline: none;
            cursor: pointer;
            padding: 6px 0;
        }

        /* Grid / Table Design */
        .grid-container {
            background: var(--surface);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-subtle);
            padding: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 8px;
        }

        th {
            background: transparent;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 12px;
            text-align: center;
        }

        .therapist-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #f8fafc;
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            font-size: 0.88rem;
            font-weight: 700;
        }

        .therapist-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            font-size: 0.75rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        td {
            vertical-align: middle;
            text-align: center;
        }

        .time-col {
            width: 18%;
        }

        .time-input {
            width: 100%;
            padding: 12px 10px;
            text-align: center;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--text-main);
            background: #f8fafc;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-button);
            outline: none;
            transition: all 0.2s;
        }

        .time-input:focus, .time-input:hover {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1);
        }

        /* Individual Card Slot States */
        .slot-cell {
            height: 64px;
            border-radius: var(--radius-button);
            transition: all 0.2s ease;
            position: relative;
        }

        /* Available Slot State */
        .slot-cell.available {
            background: #ffffff;
            border: 1px dashed #cbd5e1;
        }

        .slot-cell.available:hover {
            border-color: var(--primary);
            background: var(--primary-light);
            border-style: solid;
        }

        .book-btn {
            background: transparent;
            color: var(--primary);
            border: none;
            width: 100%;
            height: 100%;
            border-radius: var(--radius-button);
            font-weight: 700;
            font-size: 0.82rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .slot-cell.available:hover .book-btn {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(15, 118, 110, 0.25);
        }

        /* Booked Slot Card State */
        .slot-cell.booked {
            background: linear-gradient(135deg, #ecfdf5, #f0fdf4);
            border: 1px solid #a7f3d0;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
        }

        .slot-cell.booked:hover {
            border-color: var(--primary);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .booked-card {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 12px;
            height: 100%;
            width: 100%;
        }

        .booked-icon {
            width: 22px;
            height: 22px;
            background: var(--accent);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 900;
            flex-shrink: 0;
        }

        .patient-name {
            font-weight: 700;
            font-size: 0.88rem;
            color: #065f46;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- Modal Popup Styling --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--surface);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-modal);
            border: 1px solid var(--border-subtle);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
            transform: translateY(12px) scale(0.98);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.01em;
        }

        .close-modal-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.3rem;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .close-modal-btn:hover {
            background: #e2e8f0;
            color: var(--text-main);
        }

        .modal-body {
            padding: 24px;
        }

        .booking-details-banner {
            background: var(--primary-light);
            border: 1px solid var(--primary-soft);
            border-radius: var(--radius-button);
            padding: 14px 16px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .banner-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-weight: 800;
            color: var(--primary);
        }

        .banner-value {
            font-size: 0.95rem;
            font-weight: 700;
            color: #065f46;
        }

        /* Detail List Rows */
        .info-row-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
            background: #f8fafc;
            padding: 16px;
            border-radius: var(--radius-button);
            border: 1px solid var(--border-subtle);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.88rem;
        }

        .info-label {
            color: var(--text-muted);
            font-weight: 600;
        }

        .info-val {
            color: var(--text-main);
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            background: #ffffff;
            border: 1.5px solid var(--border-subtle);
            border-radius: var(--radius-button);
            outline: none;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
        }

        .form-control::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-cancel {
            flex: 1;
            padding: 12px;
            background: #f1f5f9;
            color: var(--text-muted);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-button);
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-cancel:hover {
            background: #e2e8f0;
            color: var(--text-main);
        }

        .btn-submit {
            flex: 1.5;
            padding: 12px;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-button);
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(15, 118, 110, 0.25);
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-whatsapp {
            flex: 1;
            padding: 12px;
            background: #25d366;
            color: #ffffff;
            border: none;
            border-radius: var(--radius-button);
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.25);
        }

        .btn-whatsapp:hover {
            background: #20ba5a;
            transform: translateY(-1px);
        }

        .btn-delete {
            flex: 1;
            padding: 12px;
            background: var(--danger-light);
            color: var(--danger);
            border: 1px solid #fca5a5;
            border-radius: var(--radius-button);
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background: var(--danger);
            color: #ffffff;
            border-color: var(--danger);
        }

        /* Mobile Layout Adjustments */
        @media (max-width: 768px) {
            body { padding: 16px 10px; }
            header { padding: 18px 20px; flex-direction: column; align-items: stretch; }
            .header-controls { justify-content: space-between; }
            table { border-spacing: 4px; }
            .therapist-badge { padding: 6px 12px; font-size: 0.8rem; }
            .slot-cell { height: 54px; }
            .patient-name { font-size: 0.78rem; }
            .modal-actions { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="portal-wrapper">
        <header>
            <div class="brand-section">
                <div class="brand-logo-icon">7</div>
                <div>
                    <h1 class="brand-title">Seventh Avenue Physio</h1>
                    <p class="brand-subtitle">Clinical Appointment Portal</p>
                </div>
            </div>

            <div class="header-controls">
                <div class="status-badge" id="statusBanner">
                    <span class="status-dot"></span>
                    <span id="statusText">Connecting...</span>
                </div>

                <div class="date-picker-group">
                    <label for="diaryDate">Date</label>
                    <input type="date" id="diaryDate" onchange="fetchAndRenderBookings()">
                </div>
            </div>
        </header>

        <div class="grid-container">
            <table>
                <thead>
                    <tr>
                        <th class="time-col">Time Slot</th>
                        <th>
                            <div class="therapist-badge">
                                <span class="therapist-avatar">C</span> Chido
                            </div>
                        </th>
                        <th>
                            <div class="therapist-badge">
                                <span class="therapist-avatar">M</span> Mispar
                            </div>
                        </th>
                        <th>
                            <div class="therapist-badge">
                                <span class="therapist-avatar">T</span> Tinotenda
                            </div>
                        </th>
                    </tr>
                </thead>
                <tbody id="scheduleBody">
                    <!-- Rendered dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Booking Modal Dialog -->
    <div class="modal-overlay" id="bookingModal" onclick="handleOverlayClick(event, 'bookingModal')">
        <div class="modal-card">
            <div class="modal-header">
                <h2 class="modal-title">New Appointment</h2>
                <button class="close-modal-btn" onclick="closeModal('bookingModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="booking-details-banner">
                    <span class="banner-label">Selected Slot</span>
                    <span class="banner-value" id="modalSlotSummary">Therapist at Time</span>
                </div>

                <form id="bookingForm" onsubmit="handleBookingSubmit(event)">
                    <div class="form-group">
                        <label for="patientNameInput">Patient Full Name *</label>
                        <input type="text" id="patientNameInput" class="form-control" placeholder="e.g. Sarah Jenkins" required autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label for="patientPhoneInput">WhatsApp Number (Optional)</label>
                        <input type="tel" id="patientPhoneInput" class="form-control" placeholder="e.g. +263771234567" autocomplete="off">
                    </div>

                    <div class="modal-actions">
                        <button type="button" class="btn-cancel" onclick="closeModal('bookingModal')">Cancel</button>
                        <button type="submit" class="btn-submit" id="modalSubmitBtn">Confirm Booking</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Appointment Actions Modal Dialog -->
    <div class="modal-overlay" id="actionModal" onclick="handleOverlayClick(event, 'actionModal')">
        <div class="modal-card">
            <div class="modal-header">
                <h2 class="modal-title">Appointment Actions</h2>
                <button class="close-modal-btn" onclick="closeModal('actionModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="booking-details-banner">
                    <span class="banner-label">Patient Appointment</span>
                    <span class="banner-value" id="actionPatientName">Patient Name</span>
                </div>

                <div class="info-row-list">
                    <div class="info-row">
                        <span class="info-label">Therapist:</span>
                        <span class="info-val" id="actionTherapist">Chido</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Time & Date:</span>
                        <span class="info-val" id="actionTimeDate">08:00 AM • 2026-08-18</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">WhatsApp Contact:</span>
                        <span class="info-val" id="actionPhone">Not Provided</span>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-whatsapp" id="actionWhatsAppBtn" onclick="sendWhatsAppFromActionModal()">
                        💬 Message
                    </button>
                    <button type="button" class="btn-delete" id="actionDeleteBtn" onclick="handleCancelAppointment()">
                        Cancel Booking
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = "https://wellness-portal-backend.onrender.com";
        const therapists = ["Chido", "Mispar", "Tinotenda"];
        const defaultTimeSlots = [
            "08:00 AM", "09:00 AM", "10:00 AM", "11:00 AM", 
            "12:00 PM", "01:00 PM", "02:00 PM", "03:00 PM", "04:00 PM"
        ];

        let activeBookingData = null;
        let selectedBookingTarget = null;

        document.addEventListener("DOMContentLoaded", () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById("diaryDate").value = today;
            
            renderBaseGrid();
            fetchAndRenderBookings();
        });

        window.addEventListener("focus", () => {
            fetchAndRenderBookings();
        });

        function updateStatus(msg) {
            const bannerText = document.getElementById("statusText");
            if (bannerText) bannerText.innerText = msg;
        }

        function datesMatch(d1, d2) {
            if (!d1 || !d2) return false;
            const s1 = String(d1).trim().replace(/\//g, '-').split('T')[0];
            const s2 = String(d2).trim().replace(/\//g, '-').split('T')[0];
            if (s1 === s2) return true;

            const parts1 = s1.split('-');
            const parts2 = s2.split('-');
            if (parts1.length === 3 && parts2.length === 3) {
                if (parts1[0] === parts2[2] && parts1[1] === parts2[1] && parts1[2] === parts2[0]) return true;
            }
            return false;
        }

        function parseHour(timeStr) {
            if (!timeStr) return -1;
            const match = String(timeStr).trim().toUpperCase().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i);
            if (!match) return -1;
            let hour = parseInt(match[1], 10);
            const period = match[3];
            if (period === "PM" && hour < 12) hour += 12;
            if (period === "AM" && hour === 12) hour = 0;
            return hour;
        }

        function renderBaseGrid() {
            const tbody = document.getElementById("scheduleBody");
            
            const existingTimeInputs = document.querySelectorAll('.time-input');
            const currentTimes = [];
            if (existingTimeInputs.length === defaultTimeSlots.length) {
                existingTimeInputs.forEach(input => currentTimes.push(input.value));
            } else {
                currentTimes.push(...defaultTimeSlots);
            }

            tbody.innerHTML = "";

            currentTimes.forEach((slotTime, index) => {
                const row = document.createElement("tr");

                const timeTd = document.createElement("td");
                timeTd.className = "time-col";
                timeTd.innerHTML = `
                    <input type="text" id="time-input-${index}" class="time-input" value="${slotTime}" title="Click to edit time">
                `;
                row.appendChild(timeTd);

                therapists.forEach(therapist => {
                    const slotTd = document.createElement("td");
                    slotTd.id = `slot-${therapist}-${index}`;
                    slotTd.className = "slot-cell available";
                    slotTd.innerHTML = `
                        <button class="book-btn" onclick="openBookingModal('${therapist}', ${index})">+ Book</button>
                    `;
                    row.appendChild(slotTd);
                });

                tbody.appendChild(row);
            });
        }

        async function fetchAndRenderBookings() {
            const diaryDate = document.getElementById("diaryDate").value;
            updateStatus(`Syncing (${diaryDate})...`);

            renderBaseGrid();

            try {
                const response = await fetch(`${API_BASE_URL}/api/bookings?date=${diaryDate}&t=${Date.now()}`);
                if (!response.ok) {
                    updateStatus(`Server error: ${response.status}`);
                    return;
                }

                const rawData = await response.json();
                const bookingsList = Array.isArray(rawData) 
                    ? rawData 
                    : (rawData.bookings || rawData.data || []);

                updateStatus(`Live Sync (${bookingsList.length} Bookings)`);

                therapists.forEach(therapist => {
                    defaultTimeSlots.forEach((_, index) => {
                        const timeInput = document.getElementById(`time-input-${index}`);
                        const currentSlotTime = timeInput ? timeInput.value : defaultTimeSlots[index];
                        const slotCell = document.getElementById(`slot-${therapist}-${index}`);
                        if (!slotCell) return;

                        const slotHour = parseHour(currentSlotTime);

                        const existingBooking = bookingsList.find(b => {
                            if (!b || !b.therapist || !b.time) return false;

                            const sameTherapist = String(b.therapist).trim().toLowerCase() === therapist.trim().toLowerCase();
                            if (!sameTherapist) return false;

                            if (b.date && !datesMatch(b.date, diaryDate)) return false;

                            const bookingHour = parseHour(b.time);
                            return bookingHour !== -1 && bookingHour === slotHour;
                        });

                        if (existingBooking) {
                            const name = existingBooking.patientName || existingBooking.patient_name || existingBooking.name || 'Booked';
                            const phone = existingBooking.patientPhone || existingBooking.patient_phone || existingBooking.phone || '';
                            const bookingId = existingBooking.id || existingBooking._id || '';

                            slotCell.className = "slot-cell booked";
                            slotCell.onclick = () => openActionModal({
                                id: bookingId,
                                therapist,
                                time: currentSlotTime,
                                date: diaryDate,
                                name,
                                phone
                            });

                            slotCell.innerHTML = `
                                <div class="booked-card">
                                    <div class="booked-icon">✓</div>
                                    <span class="patient-name">${name}</span>
                                </div>
                            `;
                        }
                    });
                });
            } catch (error) {
                console.error("Error fetching bookings:", error);
                updateStatus("Connection error.");
            }
        }

        /* --- Modal Operations --- */
        function openBookingModal(therapist, index) {
            const date = document.getElementById("diaryDate").value;
            const timeInput = document.getElementById(`time-input-${index}`);
            const slotTime = timeInput ? timeInput.value.trim() : defaultTimeSlots[index];

            if (!slotTime) {
                alert("Please enter a valid time slot.");
                return;
            }

            activeBookingData = { therapist, index, slotTime, date };

            document.getElementById("modalSlotSummary").innerText = `${therapist} • ${slotTime} (${date})`;
            document.getElementById("patientNameInput").value = "";
            document.getElementById("patientPhoneInput").value = "";

            const modal = document.getElementById("bookingModal");
            modal.classList.add("active");

            setTimeout(() => {
                document.getElementById("patientNameInput").focus();
            }, 100);
        }

        function openActionModal(booking) {
            selectedBookingTarget = booking;

            document.getElementById("actionPatientName").innerText = booking.name;
            document.getElementById("actionTherapist").innerText = booking.therapist;
            document.getElementById("actionTimeDate").innerText = `${booking.time} • ${booking.date}`;
            document.getElementById("actionPhone").innerText = booking.phone || "None Provided";

            const waBtn = document.getElementById("actionWhatsAppBtn");
            if (!booking.phone) {
                waBtn.style.opacity = "0.5";
                waBtn.style.cursor = "not-allowed";
            } else {
                waBtn.style.opacity = "1";
                waBtn.style.cursor = "pointer";
            }

            const modal = document.getElementById("actionModal");
            modal.classList.add("active");
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) modal.classList.remove("active");
            if (modalId === 'bookingModal') activeBookingData = null;
            if (modalId === 'actionModal') selectedBookingTarget = null;
        }

        function handleOverlayClick(event, modalId) {
            if (event.target.id === modalId) {
                closeModal(modalId);
            }
        }

        function sendWhatsAppFromActionModal() {
            if (!selectedBookingTarget || !selectedBookingTarget.phone) {
                alert("No WhatsApp phone number attached to this booking.");
                return;
            }

            const cleanPhone = selectedBookingTarget.phone.replace(/[^0-9]/g, '');
            const message = `Hello ${selectedBookingTarget.name}, this is a reminder for your appointment with ${selectedBookingTarget.therapist} on ${selectedBookingTarget.date} at ${selectedBookingTarget.time}. - Seventh Avenue Physio`;
            window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`, '_blank');
        }

        async function handleCancelAppointment() {
            if (!selectedBookingTarget) return;

            const confirmCancel = confirm(`Are you sure you want to cancel ${selectedBookingTarget.name}'s appointment with ${selectedBookingTarget.therapist}?`);
            if (!confirmCancel) return;

            updateStatus("Cancelling booking...");

            try {
                let deleteUrl = `${API_BASE_URL}/api/bookings`;
                if (selectedBookingTarget.id) {
                    deleteUrl += `/${selectedBookingTarget.id}`;
                } else {
                    deleteUrl += `?therapist=${encodeURIComponent(selectedBookingTarget.therapist)}&date=${encodeURIComponent(selectedBookingTarget.date)}&time=${encodeURIComponent(selectedBookingTarget.time)}`;
                }

                const response = await fetch(deleteUrl, {
                    method: "DELETE",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(selectedBookingTarget)
                });

                if (response.ok) {
                    closeModal('actionModal');
                    await fetchAndRenderBookings();
                } else {
                    alert("Could not cancel booking on server.");
                    updateStatus("Cancellation failed.");
                }
            } catch (error) {
                console.error("Error cancelling booking:", error);
                alert("Server error when cancelling booking.");
                updateStatus("Server error.");
            }
        }

        async function handleBookingSubmit(event) {
            event.preventDefault();
            if (!activeBookingData) return;

            const patientName = document.getElementById("patientNameInput").value.trim();
            const patientPhone = document.getElementById("patientPhoneInput").value.trim();
            const submitBtn = document.getElementById("modalSubmitBtn");

            if (!patientName) return;

            const { therapist, slotTime, date } = activeBookingData;

            const payload = { 
                therapist, 
                time: slotTime, 
                date, 
                patientName, 
                patient_name: patientName,
                name: patientName,
                patientPhone,
                phone: patientPhone
            };

            submitBtn.disabled = true;
            submitBtn.innerText = "Saving...";
            updateStatus("Saving booking...");

            try {
                const response = await fetch(`${API_BASE_URL}/api/bookings`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    closeModal('bookingModal');
                    await fetchAndRenderBookings();

                    if (patientPhone) {
                        const cleanPhone = patientPhone.replace(/[^0-9]/g, '');
                        const message = `Hello ${patientName}, your appointment with ${therapist} is confirmed for ${date} at ${slotTime}. - Seventh Avenue Physio`;
                        window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`, '_blank');
                    }
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    alert(`Booking failed: ${errorData.error || errorData.message || 'Server error'}`);
                    updateStatus("Failed to save.");
                }
            } catch (error) {
                console.error("Error saving booking:", error);
                alert("Server connection error.");
                updateStatus("Server error.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Confirm Booking";
            }
        }
    </script>
</body>
</html>
