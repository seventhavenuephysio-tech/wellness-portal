<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellness Booking Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }
        .status-bar {
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .date-picker {
            text-align: center;
            margin-bottom: 25px;
        }
        .diary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .therapist-col {
            background: #eef2f3;
            padding: 15px;
            border-radius: 6px;
        }
        .therapist-col h3 {
            text-align: center;
            margin-top: 0;
            color: #34495e;
        }
        .slot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        .btn-book {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-booked {
            background-color: #7f8c8d;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🌿 Wellness Hub</h1>
    <div class="status-bar">
        <span>Database Status: <span id="dbStatus">Checking...</span></span>
        <button onclick="fetchAndRenderBookings()">Sync Database</button>
    </div>

    <h2>Physiotherapist Appointment Diary</h2>
    <div class="date-picker">
        <label for="diaryDate">Choose Diary Date: </label>
        <input type="date" id="diaryDate" onchange="fetchAndRenderBookings()">
    </div>

    <div class="diary-grid" id="diaryGrid">
        <!-- Columns will render here dynamically -->
    </div>
</div>

<script>
    const API_BASE_URL = "https://wellness-portal-backend.onrender.com";
    const therapists = ["Chido", "Mispar", "Tinotenda"];
    const timeSlots = [
        "08:00 AM", "09:00 AM", "10:00 AM", "11:00 AM", 
        "12:00 PM", "01:00 PM", "02:00 PM", "03:00 PM", "04:00 PM"
    ];

    // Set default date to today
    document.getElementById("diaryDate").valueAsDate = new Date();

    function cleanDateString(dateStr) {
        return dateStr ? dateStr.trim() : "";
    }

    async function checkServerStatus() {
        try {
            const response = await fetch(API_BASE_URL + "/");
            const data = await response.json();
            document.getElementById("dbStatus").textContent = data.dbConnected ? "Online 🟢" : "Offline 🔴";
        } catch (e) {
            document.getElementById("dbStatus").textContent = "Error Connecting 🔴";
        }
    }

    async function fetchAndRenderBookings() {
        const selectedDate = cleanDateString(document.getElementById("diaryDate").value);
        let bookings = [];

        try {
            const response = await fetch(API_BASE_URL + "/api/bookings");
            if (response.ok) {
                bookings = await response.json();
            }
        } catch (error) {
            console.error("Error fetching bookings:", error);
        }

        const gridContainer = document.getElementById("diaryGrid");
        gridContainer.innerHTML = "";

        therapists.forEach(therapist => {
            const col = document.createElement("div");
            col.className = "therapist-col";
            col.innerHTML = `<h3>${therapist}</h3><p style="text-align:center;font-size:12px;color:#7f8c8d;">PHYSIOTHERAPIST</p>`;

            timeSlots.forEach(time => {
                const booking = bookings.find(b => 
                    b.therapist === therapist && 
                    b.time === time && 
                    cleanDateString(b.date) === selectedDate
                );

                const slotDiv = document.createElement("div");
                slotDiv.className = "slot";

                if (booking) {
                    slotDiv.innerHTML = `
                        <span>${time}</span>
                        <button class="btn-booked" disabled>Booked (${booking.patientName})</button>
                    `;
                } else {
                    slotDiv.innerHTML = `
                        <span>${time}</span>
                        <button class="btn-book" onclick="bookSlot('${therapist}', '${time}')">BOOK</button>
                    `;
                }
                col.appendChild(slotDiv);
            });

            gridContainer.appendChild(col);
        });
    }

    async function bookSlot(therapist, time) {
        const date = cleanDateString(document.getElementById("diaryDate").value);
        const patientName = prompt(`Enter patient name for ${therapist} at ${time}:`);
        if (!patientName) return;

        const patientPhone = prompt(`Enter WhatsApp number with country code (e.g. +263771234567):`);

        try {
            const response = await fetch(API_BASE_URL + "/api/bookings", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ therapist, time, date, patientName, patientPhone })
            });

            if (response.ok) {
                if (patientPhone) {
                    const cleanPhone = patientPhone.replace(/[^0-9]/g, '');
                    const message = `Hello ${patientName}, your appointment with ${therapist} is confirmed for ${date} at ${time}. - Seventh Avenue Physio`;
                    const waLink = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`;
                    
                    // Directly redirect browser tab to WhatsApp Web to bypass popup block
                    window.location.href = waLink;
                } else {
                    alert(`Booking saved to database!`);
                    fetchAndRenderBookings();
                }
            } else {
                const errorData = await response.json().catch(() => ({}));
                alert(`Booking failed: ${errorData.error || 'Server error'}`);
            }
        } catch (error) {
            console.error("Error saving booking:", error);
            alert("Server error when attempting to book.");
        }
    }

    // Initial load
    checkServerStatus();
    fetchAndRenderBookings();
</script>

</body>
</html>
