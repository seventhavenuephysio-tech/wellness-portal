<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seventh Avenue Physio - Wellness Portal</title>
    <style>
        :root {
            --primary: #00796b;
            --primary-dark: #004d40;
            --accent: #25d366;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--primary-dark);
            margin-bottom: 5px;
        }

        .practitioners-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            align-items: start;
        }

        .practitioner-column {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            border-top: 5px solid var(--primary);
        }

        .practitioner-header {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .practitioner-name {
            font-size: 18px;
            font-weight: bold;
            color: var(--primary-dark);
            margin: 0;
        }

        .practitioner-title {
            font-size: 12px;
            color: #666;
            background: #e0f2f1;
            padding: 3px 8px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 4px;
        }

        .slots-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .slot-card {
            background: #f9fbfb;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Clickable Time Slot Styling */
        .slot-time {
            font-weight: bold;
            color: var(--primary-dark);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: background 0.2s, color 0.2s;
        }

        .slot-time:hover {
            background: #e0f2f1;
            color: #1a73e8;
        }

        .slot-time-icon {
            font-size: 11px;
            opacity: 0.6;
        }

        .btn-add-slot {
            background: transparent;
            border: 1px dashed var(--primary);
            color: var(--primary-dark);
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-add-slot:hover {
            background: #e0f2f1;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .btn-danger {
            background-color: #d32f2f;
        }

        .btn-danger:hover {
            background-color: #b71c1c;
        }

        .btn-import {
            background-color: #1a73e8;
            width: 100%;
            margin-bottom: 15px;
            padding: 10px;
        }

        .btn-import:hover {
            background-color: #1557b0;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
        }

        .modal-header {
            margin-top: 0;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #888;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .modal-actions button {
            flex: 1;
        }

        .btn-whatsapp {
            background-color: var(--accent);
            width: 100%;
            padding: 12px;
            font-size: 16px;
        }

        .btn-whatsapp:hover {
            background-color: #1da851;
        }

        #csvFileInput {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Seventh Avenue Physio</h1>
            <p>Appointment & Wellness Portal</p>
        </header>

        <h2>Physiotherapist Schedules</h2>
        <div class="practitioners-grid" id="practitionersContainer"></div>
    </div>

    <!-- Booking Modal -->
    <div class="modal-overlay" id="bookingModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Book Appointment</h3>
                <button class="close-btn" onclick="closeBookingModal()">&times;</button>
            </div>

            <button class="btn btn-import" onclick="triggerCSVUpload()">📥 Import Google Contacts CSV</button>
            <input type="file" id="csvFileInput" accept=".csv" onchange="handleCSVFileSelect(event)">

            <form id="bookingForm" onsubmit="confirmBooking(event)">
                <div class="form-group">
                    <label for="slotTime">Selected Slot</label>
                    <input type="text" id="slotTime" readonly>
                </div>

                <div class="form-group">
                    <label for="patientName">Patient Full Name</label>
                    <input type="text" id="patientName" list="contactsDatalist" placeholder="Start typing patient name..." required autocomplete="off">
                    <datalist id="contactsDatalist"></datalist>
                </div>

                <div class="form-group">
                    <label for="patientPhone">WhatsApp Number</label>
                    <input type="tel" id="patientPhone" placeholder="e.g. 263777203606" required>
                </div>

                <div class="form-group">
                    <label for="practitionerName">Physiotherapist</label>
                    <input type="text" id="practitionerName" required>
                </div>

                <button type="submit" class="btn btn-whatsapp">Send WhatsApp Confirmation</button>
            </form>
        </div>
    </div>

    <!-- Direct Time Slot Editor Modal -->
    <div class="modal-overlay" id="editSingleSlotModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit Time Slot</h3>
                <button class="close-btn" onclick="closeEditSingleSlotModal()">&times;</button>
            </div>

            <p style="font-size: 14px; color: #666; margin-top: 0;">Therapist: <strong id="editSlotTherapistName"></strong></p>

            <div class="form-group">
                <label for="singleSlotInput">Time Slot</label>
                <input type="text" id="singleSlotInput" placeholder="e.g. 08:00 AM">
            </div>

            <div class="modal-actions">
                <button class="btn btn-danger" onclick="deleteCurrentSingleSlot()">Delete Slot</button>
                <button class="btn" onclick="saveCurrentSingleSlot()">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        let contactsMap = JSON.parse(localStorage.getItem("saved_patient_contacts") || "{}");
        let activeTherapistName = "";
        let activeSlotIndex = -1;

        const defaultSlots8To4 = [
            "08:00 AM",
            "09:00 AM",
            "10:00 AM",
            "11:00 AM",
            "12:00 PM",
            "01:00 PM",
            "02:00 PM",
            "03:00 PM",
            "04:00 PM"
        ];

        const defaultTherapists = [
            { name: "Chido", title: "Senior Physio", slots: [...defaultSlots8To4] },
            { name: "Mispar", title: "Physiotherapist", slots: [...defaultSlots8To4] },
            { name: "Tinotenda", title: "Physiotherapist", slots: [...defaultSlots8To4] }
        ];

        let currentTherapistsData = [];

        document.addEventListener("DOMContentLoaded", () => {
            loadSlots();
            refreshContactsDatalist();

            const nameInput = document.getElementById("patientName");
            if (nameInput) {
                nameInput.addEventListener("input", (e) => {
                    const typedVal = e.target.value.trim().toLowerCase();
                    const foundKey = Object.keys(contactsMap).find(k => k.toLowerCase() === typedVal);
                    if (foundKey && contactsMap[foundKey]) {
                        document.getElementById("patientPhone").value = contactsMap[foundKey];
                    }
                });
            }
        });

        async function loadSlots() {
            const localSaved = localStorage.getItem("saved_therapist_schedules");
            if (localSaved) {
                try {
                    currentTherapistsData = JSON.parse(localSaved);
                    renderPractitionerColumns(currentTherapistsData);
                    return;
                } catch (e) {
                    console.error("Error parsing stored schedules");
                }
            }

            try {
                const res = await fetch("/api/slots");
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) {
                        if (typeof data[0] === 'string') {
                            currentTherapistsData = defaultTherapists.map(t => ({ ...t, slots: data }));
                        } else {
                            currentTherapistsData = data;
                        }
                        renderPractitionerColumns(currentTherapistsData);
                        return;
                    }
                }
            } catch (err) {
                console.log("API offline, rendering default 8 AM - 4 PM schedule.");
            }

            currentTherapistsData = defaultTherapists;
            renderPractitionerColumns(currentTherapistsData);
        }

        function renderPractitionerColumns(practitioners) {
            const container = document.getElementById("practitionersContainer");
            container.innerHTML = "";

            practitioners.forEach(p => {
                const col = document.createElement("div");
                col.className = "practitioner-column";

                const pName = p.name || "Physiotherapist";
                const pTitle = p.title || "Physiotherapist";
                const pSlots = p.slots || [];

                let slotsHTML = "";
                pSlots.forEach((slot, idx) => {
                    const timeStr = typeof slot === 'string' ? slot : (slot.time || slot);
                    slotsHTML += `
                        <div class="slot-card">
                            <div>
                                <div class="slot-time" onclick="openEditSingleSlotModal('${pName}', ${idx})" title="Click to edit time">
                                    ${timeStr} <span class="slot-time-icon">✏️</span>
                                </div>
                                <small>Today</small>
                            </div>
                            <button class="btn" onclick="openBookingModal('${timeStr}', '${pName}')">+ Book</button>
                        </div>
                    `;
                });

                col.innerHTML = `
                    <div class="practitioner-header">
                        <h3 class="practitioner-name">${pName}</h3>
                        <span class="practitioner-title">${pTitle}</span>
                    </div>
                    <div class="slots-list">
                        ${slotsHTML || '<p style="color:#888;font-size:14px;">No available slots today</p>'}
                    </div>
                    <button class="btn-add-slot" onclick="addNewSlot('${pName}')">+ Add Time Slot</button>
                `;
                container.appendChild(col);
            });
        }

        // Direct Time Slot Editing
        function openEditSingleSlotModal(therapistName, slotIdx) {
            activeTherapistName = therapistName;
            activeSlotIndex = slotIdx;

            const therapist = currentTherapistsData.find(t => t.name === therapistName);
            if (!therapist || !therapist.slots[slotIdx]) return;

            const currentVal = typeof therapist.slots[slotIdx] === 'string' 
                ? therapist.slots[slotIdx] 
                : therapist.slots[slotIdx].time;

            document.getElementById("editSlotTherapistName").innerText = therapistName;
            document.getElementById("singleSlotInput").value = currentVal;
            document.getElementById("editSingleSlotModal").classList.add("active");
        }

        function closeEditSingleSlotModal() {
            document.getElementById("editSingleSlotModal").classList.remove("active");
        }

        async function saveCurrentSingleSlot() {
            const newVal = document.getElementById("singleSlotInput").value.trim();
            if (!newVal) return;

            const therapist = currentTherapistsData.find(t => t.name === activeTherapistName);
            if (therapist && activeSlotIndex !== -1) {
                therapist.slots[activeSlotIndex] = newVal;
                persistSchedules();
            }
            closeEditSingleSlotModal();
        }

        async function deleteCurrentSingleSlot() {
            const therapist = currentTherapistsData.find(t => t.name === activeTherapistName);
            if (therapist && activeSlotIndex !== -1) {
                therapist.slots.splice(activeSlotIndex, 1);
                persistSchedules();
            }
            closeEditSingleSlotModal();
        }

        function addNewSlot(therapistName) {
            const therapist = currentTherapistsData.find(t => t.name === therapistName);
            if (therapist) {
                const newSlot = prompt(`Add a new time slot for ${therapistName}:`, "05:00 PM");
                if (newSlot && newSlot.trim()) {
                    therapist.slots.push(newSlot.trim());
                    persistSchedules();
                }
            }
        }

        async function persistSchedules() {
            localStorage.setItem("saved_therapist_schedules", JSON.stringify(currentTherapistsData));

            try {
                await fetch('/api/slots', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: activeTherapistName, slots: currentTherapistsData.find(t => t.name === activeTherapistName)?.slots })
                });
            } catch (e) {
                console.log("Saved schedule locally.");
            }

            renderPractitionerColumns(currentTherapistsData);
        }

        // Contact Import & Booking Logic
        function refreshContactsDatalist() {
            const datalist = document.getElementById("contactsDatalist");
            if (!datalist) return;
            datalist.innerHTML = "";
            Object.keys(contactsMap).forEach(name => {
                const option = document.createElement("option");
                option.value = name;
                datalist.appendChild(option);
            });
        }

        function triggerCSVUpload() {
            document.getElementById("csvFileInput").click();
        }

        function handleCSVFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                parseGoogleCSV(e.target.result);
            };
            reader.readAsText(file);
        }

        function parseCSVToMatrix(text) {
            const firstLine = text.split('\n')[0];
            const commaCount = (firstLine.match(/,/g) || []).length;
            const semiCount = (firstLine.match(/;/g) || []).length;
            const delim = semiCount > commaCount ? ';' : ',';

            const rows = [];
            let currentRow = [];
            let currentCell = '';
            let insideQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];

                if (char === '"') {
                    if (insideQuotes && nextChar === '"') {
                        currentCell += '"';
                        i++;
                    } else {
                        insideQuotes = !insideQuotes;
                    }
                } else if (char === delim && !insideQuotes) {
                    currentRow.push(currentCell.trim());
                    currentCell = '';
                } else if ((char === '\r' || char === '\n') && !insideQuotes) {
                    if (char === '\r' && nextChar === '\n') {
                        i++;
                    }
                    currentRow.push(currentCell.trim());
                    if (currentRow.some(c => c !== '')) {
                        rows.push(currentRow);
                    }
                    currentRow = [];
                    currentCell = '';
                } else {
                    currentCell += char;
                }
            }
            if (currentCell !== '' || currentRow.length > 0) {
                currentRow.push(currentCell.trim());
                if (currentRow.some(c => c !== '')) {
                    rows.push(currentRow);
                }
            }
            return rows;
        }

        function parseGoogleCSV(csvText) {
            const rows = parseCSVToMatrix(csvText);
            if (rows.length < 2) {
                alert("The CSV file is empty or could not be read.");
                return;
            }

            const headers = rows[0].map(h => h.toLowerCase().replace(/^"|"$/g, ''));

            const nameIdx = headers.findIndex(h => h === 'name' || h === 'display name' || h === 'full name');
            const givenIdx = headers.findIndex(h => h === 'given name' || h === 'first name');
            const familyIdx = headers.findIndex(h => h === 'family name' || h === 'last name');

            const phoneIndices = [];
            headers.forEach((h, idx) => {
                if (h.includes('phone') || h.includes('mobile') || h.includes('cell') || h.includes('tel')) {
                    phoneIndices.push(idx);
                }
            });

            let addedCount = 0;
            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];

                let fullName = "";
                if (nameIdx !== -1 && row[nameIdx]) {
                    fullName = row[nameIdx];
                } else {
                    const g = givenIdx !== -1 && row[givenIdx] ? row[givenIdx] : "";
                    const f = familyIdx !== -1 && row[familyIdx] ? row[familyIdx] : "";
                    fullName = `${g} ${f}`.trim();
                }

                let phone = "";
                for (let idx of phoneIndices) {
                    if (row[idx] && row[idx].trim() !== '') {
                        phone = row[idx];
                        break;
                    }
                }

                if (!phone) {
                    for (let c = 0; c < row.length; c++) {
                        const val = row[c] ? row[c].replace(/[^\d+]/g, '') : '';
                        if (val.length >= 7) {
                            phone = row[c];
                            break;
                        }
                    }
                }

                if (fullName && phone) {
                    let cleanPhone = phone.replace(/[^\d+]/g, '');
                    contactsMap[fullName] = cleanPhone;
                    addedCount++;
                }
            }

            try {
                localStorage.setItem("saved_patient_contacts", JSON.stringify(contactsMap));
            } catch (e) {
                console.error("LocalStorage error:", e);
            }

            refreshContactsDatalist();
            alert(`Successfully imported ${addedCount} contacts!`);
        }

        function openBookingModal(timeSlot, practitionerName = "Chido") {
            document.getElementById("slotTime").value = timeSlot;
            document.getElementById("practitionerName").value = practitionerName;
            document.getElementById("bookingModal").classList.add("active");
        }

        function closeBookingModal() {
            document.getElementById("bookingModal").classList.remove("active");
        }

        async function confirmBooking(event) {
            event.preventDefault();
            const slot = document.getElementById("slotTime").value;
            const name = document.getElementById("patientName").value.trim();
            const rawPhone = document.getElementById("patientPhone").value.trim();
            const practitioner = document.getElementById("practitionerName").value.trim();

            const cleanPhone = rawPhone.replace(/[^\d]/g, '');
            const todayDate = new Date().toISOString().split('T')[0];

            try {
                await fetch('/api/bookings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ slot, name, phone: cleanPhone, practitioner, date: todayDate })
                });
            } catch (err) {
                console.log("Logged booking locally.");
            }

            const message = `Hello ${name}, your appointment with ${practitioner} is confirmed for ${todayDate} at ${slot}. - Seventh Avenue Physio`;
            const waUrl = `https://api.whatsapp.com/send/?phone=${cleanPhone}&text=${encodeURIComponent(message)}&type=phone_number&app_absent=0`;

            window.open(waUrl, '_blank');
            closeBookingModal();
        }
    </script>
</body>
</html>
