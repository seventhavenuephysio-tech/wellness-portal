<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Seventh Avenue Physio - Booking Portal</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">

    <!-- Modern Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #059669;
            --primary-hover: #047857;
            --primary-light: #ecfdf5;
            --primary-border: #059669;
            --bg-body: #f8fafc;
            --surface: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
            --shadow-subtle: 0 10px 25px -5px rgba(0, 0, 0, 0.04), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
            --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-dark);
            padding: 30px 15px;
            min-height: 100vh;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
            background: var(--surface);
            padding: 32px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-subtle);
            border: 2px solid var(--primary);
        }

        /* --- Header Section --- */
        header {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--primary-light);
            color: var(--primary);
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 5px 14px;
            border-radius: 20px;
            margin-bottom: 10px;
            border: 1.5px solid var(--primary);
        }

        h1 {
            color: var(--text-dark);
            font-size: 1.85rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* --- Live Status Banner --- */
        .status-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-align: center;
            font-size: 0.82rem;
            font-weight: 600;
            color: #475569;
            background: #f1f5f9;
            padding: 8px 16px;
            border-radius: var(--radius-md);
            margin-bottom: 24px;
            border: 1.5px solid var(--primary);
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* --- Date Controls --- */
        .date-picker-card {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
            background: #f8fafc;
            padding: 14px 20px;
            border-radius: var(--radius-md);
            border: 1.5px solid var(--primary);
        }

        .date-picker-card label {
            font-weight: 700;
            color: var(--text-dark);
            font-size: 0.9rem;
        }

        .date-picker-card input[type="date"] {
            padding: 9px 14px;
            border: 1.5px solid var(--primary);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-dark);
            background: var(--surface);
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .date-picker-card input[type="date"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.2);
        }

        /* --- Table Styling --- */
        .table-responsive {
            overflow-x: auto;
            border-radius: var(--radius-md);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border: 2px solid var(--primary);
        }

        th {
            background-color: #0f172a;
            color: #ffffff;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.8px;
            padding: 16px 12px;
            text-align: center;
            border: 1.5px solid var(--primary);
        }

        .therapist-header-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .therapist-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 800;
            color: #ffffff;
        }

        td {
            border: 1.5px solid var(--primary);
            padding: 10px;
            text-align: center;
            vertical-align: middle;
        }

        .time-col {
            background-color: #f8fafc;
            width: 22%;
        }

        /* Editable Time Box Styling */
        .time-input {
            width: 100%;
            padding: 8px 6px;
            text-align: center;
            font-weight: 700;
            color: var(--text-dark);
            border: 1.5px solid var(--primary);
            border-radius: var(--radius-sm);
            background-color: var(--surface);
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .time-input:hover {
            border-color: var(--primary-hover);
            background-color: var(--primary-light);
        }

        .time-input:focus {
            outline: none;
            border: 2px solid var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.2);
        }

        /* Booking Cells */
        .slot-cell {
            height: 72px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .slot-cell.available {
            background-color: #ffffff;
            border: 1.5px solid var(--primary);
        }

        .slot-cell.booked {
            background-color: var(--primary-light);
            border: 2.5px solid var(--primary) !important;
        }

        /* Booking Action Button */
        .book-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 9px 20px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 700;
            font-size: 0.82rem;
            letter-spacing: 0.5px;
            display: inline-block;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-card);
        }

        .book-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25);
        }

        .book-btn:active {
            transform: translateY(0);
        }

        /* Booked Slot Card */
        .booked-info {
            color: #065f46;
            font-size: 0.92rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 4px;
        }

        .booked-info::before {
            content: "✓";
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            background: var(--primary);
            color: #ffffff;
            border-radius: 50%;
            font-size: 0.7rem;
            font-weight: 900;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            body { padding: 12px 8px; }
            .container { padding: 18px 12px; border-radius: var(--radius-md); }
            h1 { font-size: 1.4rem; }
            th, td { padding: 8px 4px; font-size: 0.8rem; }
            .book-btn { padding: 7px 12px; font-size: 0.75rem; }
            .time-input { font-size: 0.8rem; padding: 6px 2px; }
            .booked-info { font-size: 0.82rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="brand-badge">Seventh Avenue Physio</div>
            <h1>Wellness Booking Portal</h1>
            <p class="subtitle">Select date & therapist to manage appointment schedule</p>
        </header>

        <div id="statusBanner" class="status-banner">
            <span class="status-dot"></span>
            <span id="statusText">Connecting to server...</span>
        </div>

        <div class="date-picker-card">
            <label for="diaryDate">Schedule Date:</label>
            <input type="date" id="diaryDate" onchange="fetchAndRenderBookings()">
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th class="time-col">Editable Time</th>
                        <th>
                            <div class="therapist-header-cell">
                                <span class="therapist-avatar">C</span> Chido
                            </div>
                        </th>
                        <th>
                            <div class="therapist-header-cell">
                                <span class="therapist-avatar">M</span> Mispar
                            </div>
                        </th>
                        <th>
                            <div class="therapist-header-cell">
                                <span class="therapist-avatar">T</span> Tinotenda
                            </div>
                        </th>
                    </tr>
                </thead>
                <tbody id="scheduleBody">
                    <!-- Dynamic rendering via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_BASE_URL = "https://wellness-portal-backend.onrender.com";
        const therapists = ["Chido", "Mispar", "Tinotenda"];
        const defaultTimeSlots = [
            "08:00 AM", "09:00 AM", "10:00 AM", "11:00 AM", 
            "12:00 PM", "01:00 PM", "02:00 PM", "03:00 PM", "04:00 PM"
        ];

        document.addEventListener("DOMContentLoaded", () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById("diaryDate").value = today;
            
            renderBaseGrid();
            fetchAndRenderBookings();
        });

        window.addEventListener("focus", () => {
            fetchAndRenderBookings();
        });

        function updateStatus(msg) {
            const bannerText = document.getElementById("statusText");
            if (bannerText) bannerText.innerText = msg;
        }

        function datesMatch(d1, d2) {
            if (!d1 || !d2) return false;
            const s1 = String(d1).trim().replace(/\//g, '-').split('T')[0];
            const s2 = String(d2).trim().replace(/\//g, '-').split('T')[0];
            if (s1 === s2) return true;

            const parts1 = s1.split('-');
            const parts2 = s2.split('-');
            if (parts1.length === 3 && parts2.length === 3) {
                if (parts1[0] === parts2[2] && parts1[1] === parts2[1] && parts1[2] === parts2[0]) return true;
            }
            return false;
        }

        function parseHour(timeStr) {
            if (!timeStr) return -1;
            const match = String(timeStr).trim().toUpperCase().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i);
            if (!match) return -1;
            let hour = parseInt(match[1], 10);
            const period = match[3];
            if (period === "PM" && hour < 12) hour += 12;
            if (period === "AM" && hour === 12) hour = 0;
            return hour;
        }

        function renderBaseGrid() {
            const tbody = document.getElementById("scheduleBody");
            
            const existingTimeInputs = document.querySelectorAll('.time-input');
            const currentTimes = [];
            if (existingTimeInputs.length === defaultTimeSlots.length) {
                existingTimeInputs.forEach(input => currentTimes.push(input.value));
            } else {
                currentTimes.push(...defaultTimeSlots);
            }

            tbody.innerHTML = "";

            currentTimes.forEach((slotTime, index) => {
                const row = document.createElement("tr");

                const timeTd = document.createElement("td");
                timeTd.className = "time-col";
                timeTd.innerHTML = `
                    <input type="text" id="time-input-${index}" class="time-input" value="${slotTime}" title="Click to edit time slot">
                `;
                row.appendChild(timeTd);

                therapists.forEach(therapist => {
                    const slotTd = document.createElement("td");
                    slotTd.id = `slot-${therapist}-${index}`;
                    slotTd.className = "slot-cell available";
                    slotTd.innerHTML = `
                        <button class="book-btn" onclick="bookSlot('${therapist}', ${index})">BOOK</button>
                    `;
                    row.appendChild(slotTd);
                });

                tbody.appendChild(row);
            });
        }

        async function fetchAndRenderBookings() {
            const diaryDate = document.getElementById("diaryDate").value;
            updateStatus(`Loading bookings for ${diaryDate}...`);

            renderBaseGrid();

            try {
                const response = await fetch(`${API_BASE_URL}/api/bookings?date=${diaryDate}&t=${Date.now()}`);
                if (!response.ok) {
                    updateStatus(`Server response error: ${response.status}`);
                    return;
                }

                const rawData = await response.json();
                const bookingsList = Array.isArray(rawData) 
                    ? rawData 
                    : (rawData.bookings || rawData.data || []);

                updateStatus(`Connected | ${bookingsList.length} total bookings recorded`);

                therapists.forEach(therapist => {
                    defaultTimeSlots.forEach((_, index) => {
                        const timeInput = document.getElementById(`time-input-${index}`);
                        const currentSlotTime = timeInput ? timeInput.value : defaultTimeSlots[index];
                        const slotCell = document.getElementById(`slot-${therapist}-${index}`);
                        if (!slotCell) return;

                        const slotHour = parseHour(currentSlotTime);

                        const existingBooking = bookingsList.find(b => {
                            if (!b || !b.therapist || !b.time) return false;

                            const sameTherapist = String(b.therapist).trim().toLowerCase() === therapist.trim().toLowerCase();
                            if (!sameTherapist) return false;

                            if (b.date && !datesMatch(b.date, diaryDate)) return false;

                            const bookingHour = parseHour(b.time);
                            return bookingHour !== -1 && bookingHour === slotHour;
                        });

                        if (existingBooking) {
                            const name = existingBooking.patientName || existingBooking.patient_name || existingBooking.name || 'Booked';
                            slotCell.className = "slot-cell booked";
                            slotCell.innerHTML = `
                                <div class="booked-info">
                                    <span>${name}</span>
                                </div>
                            `;
                        }
                    });
                });
            } catch (error) {
                console.error("Error fetching bookings:", error);
                updateStatus("Error connecting to database server.");
            }
        }

        async function bookSlot(therapist, index) {
            const date = document.getElementById("diaryDate").value;
            const timeInput = document.getElementById(`time-input-${index}`);
            const slotTime = timeInput ? timeInput.value.trim() : defaultTimeSlots[index];

            if (!slotTime) {
                alert("Please enter a valid time for this slot.");
                return;
            }

            const patientName = prompt(`Enter patient name for ${therapist} at ${slotTime}:`);
            if (!patientName) return;

            const patientPhone = prompt(`Enter WhatsApp number with country code (e.g. +263771234567):`);

            const payload = { 
                therapist, 
                time: slotTime, 
                date, 
                patientName: patientName.trim(), 
                patient_name: patientName.trim(),
                name: patientName.trim(),
                patientPhone: patientPhone ? patientPhone.trim() : "",
                phone: patientPhone ? patientPhone.trim() : ""
            };

            updateStatus("Saving booking to database...");

            try {
                const response = await fetch(`${API_BASE_URL}/api/bookings`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert(`Booking saved for ${slotTime}!`);
                    await fetchAndRenderBookings();

                    if (patientPhone) {
                        const cleanPhone = patientPhone.replace(/[^0-9]/g, '');
                        const message = `Hello ${patientName.trim()}, your appointment with ${therapist} is confirmed for ${date} at ${slotTime}. - Seventh Avenue Physio`;
                        window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`, '_blank');
                    }
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    alert(`Booking failed: ${errorData.error || errorData.message || 'Server error'}`);
                    updateStatus("Booking failed.");
                }
            } catch (error) {
                console.error("Error saving booking:", error);
                alert("Server error when attempting to book.");
                updateStatus("Server error.");
            }
        }
    </script>
</body>
</html>
