<script>
    let contactsMap = JSON.parse(localStorage.getItem("saved_patient_contacts") || "{}");
    let bookingsList = [];
    let activeTherapistName = "";
    let activeSlotIndex = -1;

    const defaultSlots8To4 = [
        "08:00 AM", "09:00 AM", "10:00 AM", "11:00 AM",
        "12:00 PM", "01:00 PM", "02:00 PM", "03:00 PM", "04:00 PM"
    ];

    const defaultTherapists = [
        { name: "Chido", title: "Senior Physio", slots: [...defaultSlots8To4] },
        { name: "Mispar", title: "Physiotherapist", slots: [...defaultSlots8To4] },
        { name: "Tinotenda", title: "Physiotherapist", slots: [...defaultSlots8To4] }
    ];

    let currentTherapistsData = defaultTherapists;

    // Helper for consistent local YYYY-MM-DD date matching across timezones
    function getTodayDateString() {
        const d = new Date();
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    document.addEventListener("DOMContentLoaded", () => {
        loadSlots();
        refreshContactsDatalist();

        // Auto-refresh when switching back to the tab or app
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") loadSlots();
        });

        // Background poll every 15 seconds to keep PC & Mobile in sync
        setInterval(loadSlots, 15000);

        const nameInput = document.getElementById("patientName");
        if (nameInput) {
            const autoFillPhone = (e) => {
                const typedVal = e.target.value.trim().toLowerCase();
                if (!typedVal) return;
                const foundKey = Object.keys(contactsMap).find(k => k.trim().toLowerCase() === typedVal);
                if (foundKey && contactsMap[foundKey]) {
                    document.getElementById("patientPhone").value = contactsMap[foundKey];
                }
            };

            nameInput.addEventListener("input", autoFillPhone);
            nameInput.addEventListener("change", autoFillPhone);
            nameInput.addEventListener("blur", autoFillPhone);
        }
    });

    async function loadSlots() {
        // 1. Always fetch server bookings first
        try {
            const bRes = await fetch("/api/bookings");
            if (bRes.ok) {
                const bData = await bRes.json();
                if (Array.isArray(bData)) {
                    bookingsList = bData;
                    localStorage.setItem("saved_bookings", JSON.stringify(bookingsList));
                }
            }
        } catch (e) {
            console.log("Offline: Using local bookings cache.");
            bookingsList = JSON.parse(localStorage.getItem("saved_bookings") || "[]");
        }

        // 2. Always fetch server slots first before falling back to local storage
        try {
            const res = await fetch("/api/slots");
            if (res.ok) {
                const data = await res.json();
                if (Array.isArray(data) && data.length > 0) {
                    currentTherapistsData = typeof data[0] === 'string'
                        ? defaultTherapists.map(t => ({ ...t, slots: data }))
                        : data;
                    localStorage.setItem("saved_therapist_schedules", JSON.stringify(currentTherapistsData));
                    renderPractitionerColumns(currentTherapistsData);
                    return;
                }
            }
        } catch (err) {
            console.log("Offline: Using local schedules cache.");
        }

        // Fallback to local storage only if network request fails
        const localSaved = localStorage.getItem("saved_therapist_schedules");
        if (localSaved) {
            try { currentTherapistsData = JSON.parse(localSaved); } catch (e) {}
        }
        renderPractitionerColumns(currentTherapistsData);
    }

    function renderPractitionerColumns(practitioners) {
        const container = document.getElementById("practitionersContainer");
        if (!container) return;
        container.innerHTML = "";
        const todayDate = getTodayDateString();

        practitioners.forEach(p => {
            const col = document.createElement("div");
            col.className = "practitioner-column";

            const pName = p.name || "Physiotherapist";
            const pTitle = p.title || "Physiotherapist";
            const pSlots = p.slots || [];

            let slotsHTML = "";
            pSlots.forEach((slot, idx) => {
                const timeStr = typeof slot === 'string' ? slot : (slot.time || slot);
                
                const existingBooking = bookingsList.find(b => 
                    b.practitioner === pName && 
                    (b.slot === timeStr || b.time === timeStr) && 
                    (b.date === todayDate || !b.date)
                );

                if (existingBooking) {
                    slotsHTML += `
                        <div class="slot-card booked-card">
                            <div>
                                <div class="slot-time" onclick="openEditSingleSlotModal('${pName}', ${idx})" title="Click to edit time">
                                    ${timeStr}
                                </div>
                                <div class="booking-details">
                                    👤 <strong>${existingBooking.name}</strong><br>
                                    <small>📱 ${existingBooking.phone}</small>
                                </div>
                            </div>
                            <div class="booking-actions">
                                <button class="btn btn-sm btn-success" onclick="sendWhatsAppReminder('${existingBooking.name}', '${existingBooking.phone}', '${pName}', '${timeStr}')">💬 Remind</button>
                                <button class="btn btn-danger btn-sm" onclick="cancelBooking('${pName}', '${timeStr}')">Cancel</button>
                            </div>
                        </div>
                    `;
                } else {
                    slotsHTML += `
                        <div class="slot-card">
                            <div class="slot-time" onclick="openEditSingleSlotModal('${pName}', ${idx})" title="Click to edit time">
                                ${timeStr}
                            </div>
                            <button class="btn" onclick="openBookingModal('${timeStr}', '${pName}')">+ Book</button>
                        </div>
                    `;
                }
            });

            col.innerHTML = `
                <div class="practitioner-header">
                    <h3 class="practitioner-name">${pName}</h3>
                    <span class="practitioner-title">${pTitle}</span>
                </div>
                <div class="slots-list">
                    ${slotsHTML || '<p style="color:#888;font-size:14px;">No available slots today</p>'}
                </div>
                <button class="btn-add-slot" onclick="addNewSlot('${pName}')">+ Add Time Slot</button>
            `;
            container.appendChild(col);
        });
    }

    function sendWhatsAppReminder(name, rawPhone, practitioner, slot) {
        const cleanPhone = rawPhone.replace(/[^\d]/g, '');
        if (!cleanPhone || cleanPhone.length < 7) {
            alert("No valid phone number found for this booking.");
            return;
        }

        const message = `Hello ${name}, this is a reminder for your upcoming appointment with ${practitioner} today at ${slot}. - Seventh Avenue Physio`;
        window.location.href = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`;
    }

    async function cancelBooking(practitioner, timeSlot) {
        if (!confirm(`Are you sure you want to cancel the booking at ${timeSlot} for ${practitioner}?`)) return;

        const todayDate = getTodayDateString();
        bookingsList = bookingsList.filter(b => !(b.practitioner === practitioner && (b.slot === timeSlot || b.time === timeSlot)));
        localStorage.setItem("saved_bookings", JSON.stringify(bookingsList));
        renderPractitionerColumns(currentTherapistsData);

        try {
            await fetch('/api/bookings/cancel', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ practitioner, slot: timeSlot, date: todayDate })
            });
            loadSlots();
        } catch (err) {
            console.log("Server cancel request failed.");
        }
    }

    function openEditSingleSlotModal(therapistName, slotIdx) {
        activeTherapistName = therapistName;
        activeSlotIndex = slotIdx;

        const therapist = currentTherapistsData.find(t => t.name === therapistName);
        if (!therapist || !therapist.slots[slotIdx]) return;

        const currentVal = typeof therapist.slots[slotIdx] === 'string' 
            ? therapist.slots[slotIdx] 
            : therapist.slots[slotIdx].time;

        document.getElementById("editSlotTherapistName").innerText = therapistName;
        document.getElementById("singleSlotInput").value = currentVal;
        document.getElementById("editSingleSlotModal").classList.add("active");
    }

    function closeEditSingleSlotModal() {
        document.getElementById("editSingleSlotModal").classList.remove("active");
    }

    async function saveCurrentSingleSlot() {
        const newVal = document.getElementById("singleSlotInput").value.trim();
        if (!newVal) return;

        const therapist = currentTherapistsData.find(t => t.name === activeTherapistName);
        if (therapist && activeSlotIndex !== -1) {
            therapist.slots[activeSlotIndex] = newVal;
            await persistSchedules();
        }
        closeEditSingleSlotModal();
    }

    async function deleteCurrentSingleSlot() {
        const therapist = currentTherapistsData.find(t => t.name === activeTherapistName);
        if (therapist && activeSlotIndex !== -1) {
            therapist.slots.splice(activeSlotIndex, 1);
            await persistSchedules();
        }
        closeEditSingleSlotModal();
    }

    function addNewSlot(therapistName) {
        const therapist = currentTherapistsData.find(t => t.name === therapistName);
        if (therapist) {
            const newSlot = prompt(`Add a new time slot for ${therapistName}:`, "05:00 PM");
            if (newSlot && newSlot.trim()) {
                therapist.slots.push(newSlot.trim());
                persistSchedules();
            }
        }
    }

    async function persistSchedules() {
        localStorage.setItem("saved_therapist_schedules", JSON.stringify(currentTherapistsData));
        renderPractitionerColumns(currentTherapistsData);

        try {
            await fetch('/api/slots', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: activeTherapistName, slots: currentTherapistsData.find(t => t.name === activeTherapistName)?.slots })
            });
            loadSlots();
        } catch (e) {
            console.log("Saved schedule locally.");
        }
    }

    function refreshContactsDatalist() {
        const datalist = document.getElementById("contactsDatalist");
        if (!datalist) return;
        datalist.innerHTML = "";
        Object.keys(contactsMap).forEach(name => {
            const option = document.createElement("option");
            option.value = name;
            datalist.appendChild(option);
        });
    }

    function triggerCSVUpload() {
        document.getElementById("csvFileInput").click();
    }

    function handleCSVFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            parseGoogleCSV(e.target.result);
        };
        reader.readAsText(file);
    }

    function parseCSVToMatrix(text) {
        const firstLine = text.split('\n')[0];
        const commaCount = (firstLine.match(/,/g) || []).length;
        const semiCount = (firstLine.match(/;/g) || []).length;
        const delim = semiCount > commaCount ? ';' : ',';

        const rows = [];
        let currentRow = [];
        let currentCell = '';
        let insideQuotes = false;

        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            const nextChar = text[i + 1];

            if (char === '"') {
                if (insideQuotes && nextChar === '"') {
                    currentCell += '"';
                    i++;
                } else {
                    insideQuotes = !insideQuotes;
                }
            } else if (char === delim && !insideQuotes) {
                currentRow.push(currentCell.trim());
                currentCell = '';
            } else if ((char === '\r' || char === '\n') && !insideQuotes) {
                if (char === '\r' && nextChar === '\n') i++;
                currentRow.push(currentCell.trim());
                if (currentRow.some(c => c !== '')) rows.push(currentRow);
                currentRow = [];
                currentCell = '';
            } else {
                currentCell += char;
            }
        }
        if (currentCell !== '' || currentRow.length > 0) {
            currentRow.push(currentCell.trim());
            if (currentRow.some(c => c !== '')) rows.push(currentRow);
        }
        return rows;
    }

    function parseGoogleCSV(csvText) {
        const rows = parseCSVToMatrix(csvText);
        if (rows.length < 2) {
            alert("The CSV file is empty or could not be read.");
            return;
        }

        const headers = rows[0].map(h => h.toLowerCase().replace(/^"|"$/g, '').trim());
        const nameIdx = headers.findIndex(h => h === 'name' || h === 'display name' || h === 'full name');
        const givenIdx = headers.findIndex(h => h === 'given name' || h === 'first name');
        const familyIdx = headers.findIndex(h => h === 'family name' || h === 'last name');

        let addedCount = 0;

        for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            if (!row || row.length === 0) continue;

            let fullName = "";
            if (nameIdx !== -1 && row[nameIdx] && row[nameIdx].trim()) {
                fullName = row[nameIdx].trim();
            } else {
                const g = (givenIdx !== -1 && row[givenIdx]) ? row[givenIdx].trim() : "";
                const f = (familyIdx !== -1 && row[familyIdx]) ? row[familyIdx].trim() : "";
                fullName = `${g} ${f}`.trim();
            }

            if (!fullName) continue;

            let extractedPhone = "";
            for (let c = 0; c < row.length; c++) {
                const header = headers[c] || "";
                const isPhoneHeader = (header.includes("phone") || header.includes("mobile") || header.includes("cell") || header.includes("tel")) 
                                      && !header.includes("type") && !header.includes("label");

                if (isPhoneHeader && row[c]) {
                    const digitsOnly = row[c].replace(/[^\d]/g, '');
                    if (digitsOnly.length >= 7) {
                        extractedPhone = row[c];
                        break;
                    }
                }
            }

            if (!extractedPhone) {
                for (let c = 0; c < row.length; c++) {
                    if (row[c]) {
                        const digitsOnly = row[c].replace(/[^\d]/g, '');
                        if (digitsOnly.length >= 7 && digitsOnly.length <= 15) {
                            extractedPhone = row[c];
                            break;
                        }
                    }
                }
            }

            if (fullName && extractedPhone) {
                let cleanPhone = extractedPhone.replace(/[^\d]/g, '');
                if (cleanPhone.length >= 7) {
                    contactsMap[fullName] = cleanPhone;
                    addedCount++;
                }
            }
        }

        localStorage.setItem("saved_patient_contacts", JSON.stringify(contactsMap));
        refreshContactsDatalist();
        alert(`Successfully imported ${addedCount} contacts with valid phone numbers!`);
    }

    function openBookingModal(timeSlot, practitionerName = "Chido") {
        document.getElementById("slotTime").value = timeSlot;
        document.getElementById("practitionerName").value = practitionerName;
        document.getElementById("bookingModal").classList.add("active");
    }

    function closeBookingModal() {
        document.getElementById("bookingModal").classList.remove("active");
    }

    async function confirmBooking(event) {
        event.preventDefault();
        const slot = document.getElementById("slotTime").value;
        const name = document.getElementById("patientName").value.trim();
        const rawPhone = document.getElementById("patientPhone").value.trim();
        const practitioner = document.getElementById("practitionerName").value.trim();

        const cleanPhone = rawPhone.replace(/[^\d]/g, '');
        if (!cleanPhone || cleanPhone.length < 7) {
            alert("Please enter a valid phone number with digits.");
            return;
        }

        const todayDate = getTodayDateString();
        const newBooking = { slot, name, phone: cleanPhone, practitioner, date: todayDate };

        // Save to backend first
        try {
            await fetch('/api/bookings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newBooking)
            });
        } catch (err) {
            console.log("Saved booking locally offline.");
        }

        // Re-sync UI from server state
        await loadSlots();
        closeBookingModal();

        // Redirect to WhatsApp
        const message = `Hello ${name}, your appointment with ${practitioner} is confirmed for ${todayDate} at ${slot}. - Seventh Avenue Physio`;
        window.location.href = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`;
    }
</script>
