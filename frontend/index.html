<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wellness Centre — Clinical Appointments</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --primary-light: #e0f2fe;
            --accent: #0f766e;
            --accent-light: #ccfbf1;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.07);
            --shadow-lg: 0 10px 25px -5px rgb(0 0 0 / 0.08);
            --radius: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text-main); min-height: 100vh; padding-bottom: 60px; }

        .navbar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-logo {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #0284c7, #0f766e);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
        }
        .brand-text h1 { font-size: 1.2rem; font-weight: 800; color: var(--text-main); line-height: 1.2; }
        .brand-text p { font-size: 0.78rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }

        .nav-stats { display: flex; gap: 12px; }
        .stat-chip {
            background: #f1f5f9;
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stat-chip.highlight { background: var(--primary-light); color: var(--primary-dark); border-color: #bae6fd; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; }

        .container { max-width: 1280px; margin: 32px auto; padding: 0 24px; }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 16px;
        }
        .search-input {
            background: white;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 0.9rem;
            width: 280px;
            outline: none;
            transition: all 0.2s;
        }
        .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }

        .practitioner-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 24px;
        }

        .p-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .p-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }

        .p-card-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, #ffffff 0%, #fafafa 100%);
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .p-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e0f2fe, #ccfbf1);
            color: var(--primary-dark);
            font-weight: 800;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
            box-shadow: var(--shadow-sm);
        }
        .p-meta h3 { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
        .p-meta p { font-size: 0.825rem; color: var(--text-muted); font-weight: 500; }
        .p-tag {
            margin-left: auto;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            background: var(--accent-light);
            color: var(--accent);
        }

        .slots-list { padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }

        .slot-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #ffffff;
            transition: all 0.15s ease;
        }
        .slot-row:hover { border-color: #cbd5e1; background: #f8fafc; }
        .slot-row.is-booked { background: #f8fafc; border-color: #cbd5e1; }

        .slot-time { font-weight: 700; font-size: 0.9rem; color: var(--text-main); }
        .patient-detail { margin-top: 2px; font-size: 0.8rem; color: var(--text-muted); }
        .patient-name-val { font-weight: 600; color: var(--text-main); }

        .btn {
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.825rem;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-danger { background: #fee2e2; color: #dc2626; }
        .btn-danger:hover { background: #fca5a5; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white;
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow-lg);
            animation: modalPop 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .modal-title { font-size: 1.15rem; font-weight: 800; color: var(--text-main); }
        .close-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: var(--text-muted); }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 6px; color: var(--text-main); }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }
        .form-control:focus { border-color: var(--primary); }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #0f172a;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: var(--shadow-lg);
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 2000;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="brand">
        <div class="brand-logo">┼</div>
        <div class="brand-text">
            <h1>The Wellness Centre</h1>
            <p>PHYSIOTHERAPY BOOKING PORTAL</p>
        </div>
    </div>
    <div class="nav-stats">
        <div class="stat-chip"><span class="dot"></span> Live Portal</div>
        <div class="stat-chip highlight"><span id="totalBookedCount">0</span> Appointments Scheduled</div>
    </div>
</div>

<div class="container">
    <div class="toolbar">
        <input type="text" id="searchInput" class="search-input" placeholder="Search practitioner..." onkeyup="filterPractitioners()">
    </div>
    <div id="app" class="practitioner-grid"></div>
</div>

<div class="modal-overlay" id="bookingModal">
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title">Book Appointment</h3>
            <button class="close-btn" onclick="closeModal()">×</button>
        </div>
        <div class="form-group">
            <label>Practitioner & Slot</label>
            <input type="text" id="modalSlotInfo" class="form-control" disabled style="background:#f1f5f9;">
        </div>
        <div class="form-group">
            <label>Patient Full Name</label>
            <input type="text" id="patientNameInput" class="form-control" placeholder="e.g. John Doe">
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" id="patientPhoneInput" class="form-control" placeholder="e.g. +263 77 123 4567">
        </div>
        <div class="modal-actions">
            <button class="btn" style="background:#f1f5f9; color:#475569;" onclick="closeModal()">Cancel</button>
            <button class="btn btn-primary" onclick="submitBooking()">Confirm Booking</button>
        </div>
    </div>
</div>

<div class="toast" id="toast">
    <span id="toastMsg">Action completed successfully</span>
</div>

<script>
    localStorage.removeItem("saved_therapist_schedules");

    const therapists = [
        { name: "Chido", role: "Physiotherapist", slots: ["08:00 AM", "09:00 AM", "10:00 AM", "11:00 AM", "12:00 PM", "01:00 PM", "02:00 PM", "03:00 PM", "04:00 PM"] },
        { name: "Mispar", role: "Physiotherapist", slots: ["08:00 AM", "09:00 AM", "10:00 AM", "11:00 AM", "12:00 PM", "01:00 PM", "02:00 PM", "03:00 PM", "04:00 PM"] },
        { name: "Tinotenda", role: "Physiotherapist", slots: ["08:00 AM", "09:00 AM", "10:00 AM", "11:00 AM", "12:00 PM", "01:00 PM", "02:00 PM", "03:00 PM", "04:00 PM"] }
    ];

    let bookingsList = [];
    let currentBookingTarget = null;

    function showToast(msg) {
        const toast = document.getElementById("toast");
        document.getElementById("toastMsg").textContent = msg;
        toast.style.display = "flex";
        setTimeout(() => toast.style.display = "none", 3000);
    }

    function openModal(practitioner, slot) {
        currentBookingTarget = { practitioner, slot };
        document.getElementById("modalSlotInfo").value = `${practitioner} — ${slot}`;
        document.getElementById("patientNameInput").value = "";
        document.getElementById("patientPhoneInput").value = "";
        document.getElementById("bookingModal").classList.add("active");
    }

    function closeModal() {
        document.getElementById("bookingModal").classList.remove("active");
        currentBookingTarget = null;
    }

    async function submitBooking() {
        if (!currentBookingTarget) return;
        const name = document.getElementById("patientNameInput").value.trim();
        const phone = document.getElementById("patientPhoneInput").value.trim();
        if (!name) return alert("Please enter patient name.");

        const { practitioner, slot } = currentBookingTarget;
        const booking = { practitioner, therapist: practitioner, slot, time: slot, name, phone };
        
        bookingsList.push(booking);
        closeModal();
        renderColumns(therapists);
        showToast("Booking confirmed for " + name);

        try {
            await fetch('/api/bookings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(booking)
            });
        } catch (err) { console.error(err); }
    }

    async function loadSlots() {
        try {
            const res = await fetch("/api/bookings");
            if (res.ok) {
                const data = await res.json();
                if (Array.isArray(data)) bookingsList = data;
            }
        } catch (e) {}
        renderColumns(therapists);
    }

    async function cancelBooking(practitioner, slot) {
        if (!confirm(`Cancel appointment at ${slot} for ${practitioner}?`)) return;
        bookingsList = bookingsList.filter(b => !(
            (b.practitioner === practitioner || b.therapist === practitioner) &&
            (b.slot === slot || b.time === slot)
        ));
        renderColumns(therapists);
        showToast("Appointment canceled.");

        try {
            await fetch('/api/bookings/cancel', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ practitioner, slot })
            });
        } catch (err) { console.error(err); }
    }

    function filterPractitioners() {
        const query = document.getElementById("searchInput").value.toLowerCase();
        const filtered = therapists.filter(t => t.name.toLowerCase().includes(query) || t.role.toLowerCase().includes(query));
        renderColumns(filtered);
    }

    function renderColumns(data) {
        document.getElementById("totalBookedCount").textContent = bookingsList.length;
        const app = document.getElementById("app");
        app.innerHTML = "";
        data.forEach(p => {
            const card = document.createElement("div");
            card.className = "p-card";
            
            let slotsHTML = "";
            p.slots.forEach(slot => {
                const booking = bookingsList.find(b => 
                    (b.practitioner === p.name || b.therapist === p.name) && 
                    (b.slot === slot || b.time === slot)
                );
                if (booking) {
                    slotsHTML += `
                        <div class="slot-row is-booked">
                            <div>
                                <div class="slot-time">${slot}</div>
                                <div class="patient-detail"><span class="patient-name-val">👤 ${booking.name}</span> ${booking.phone ? `• 📱 ${booking.phone}` : ''}</div>
                            </div>
                            <button class="btn btn-danger" onclick="cancelBooking('${p.name}', '${slot}')">Cancel</button>
                        </div>`;
                } else {
                    slotsHTML += `
                        <div class="slot-row">
                            <div class="slot-time">${slot}</div>
                            <button class="btn btn-primary" onclick="openModal('${p.name}', '${slot}')">+ Book</button>
                        </div>`;
                }
            });

            card.innerHTML = `
                <div class="p-card-header">
                    <div class="p-avatar">${p.name.charAt(0)}</div>
                    <div class="p-meta">
                        <h3>${p.name}</h3>
                        <p>${p.role}</p>
                    </div>
                    <span class="p-tag">Available</span>
                </div>
                <div class="slots-list">${slotsHTML}</div>`;
            app.appendChild(card);
        });
    }

    loadSlots();
    setInterval(loadSlots, 3000);
</script>
</body>
</html>
