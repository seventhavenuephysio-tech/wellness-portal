<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wellness Centre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f1f5f9;
            --surface: #ffffff;
            --primary: #0f766e;
            --primary-hover: #0d9488;
            --primary-light: #ccfbf1;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --booked-bg: #f8fafc;
            --booked-border: #cbd5e1;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08);
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
        
        body { 
            background-color: var(--bg-main); 
            margin: 0; 
            padding: 28px 20px; 
            display: flex; 
            justify-content: center; 
            color: var(--text-dark);
            min-height: 100vh;
        }

        .container { 
            width: 100%; 
            max-width: 1320px; 
            display: flex; 
            flex-direction: column; 
            gap: 24px; 
        }

        .header-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 20px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #0f766e, #14b8a6);
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(15, 118, 110, 0.25);
        }

        .header-title { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--text-dark); letter-spacing: -0.02em; }
        .header-sub { margin: 2px 0 0 0; font-size: 0.85rem; color: var(--text-muted); }

        .booked-badge { 
            background: var(--primary-light); 
            color: var(--primary); 
            padding: 8px 16px; 
            border-radius: 9999px; 
            font-size: 0.875rem; 
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(15, 118, 110, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(15, 118, 110, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(15, 118, 110, 0); }
            100% { box-shadow: 0 0 0 0 rgba(15, 118, 110, 0); }
        }

        .app-grid { 
            display: grid; 
            grid-template-columns: repeat(3, minmax(0, 1fr)); 
            gap: 24px; 
            width: 100%; 
        }

        @media (max-width: 960px) {
            .app-grid { grid-template-columns: 1fr; }
        }

        .card { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            border-radius: var(--radius-lg); 
            padding: 20px; 
            box-shadow: var(--shadow-md); 
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .practitioner-header { 
            display: flex; 
            align-items: center; 
            gap: 12px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #f1f5f9;
            color: var(--primary);
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--primary-light);
        }

        .practitioner-info { flex: 1; }
        .practitioner-name { font-weight: 700; font-size: 1.15rem; color: var(--text-dark); margin: 0; }
        .practitioner-role { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; margin-top: 2px; }

        .slots-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .slot-card { 
            border: 1px solid var(--border); 
            border-radius: var(--radius-md); 
            padding: 12px 16px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: var(--surface);
            transition: all 0.2s ease;
        }

        .slot-card:hover {
            border-color: #cbd5e1;
            box-shadow: var(--shadow-sm);
        }

        .slot-card.booked { 
            background: var(--booked-bg); 
            border-color: var(--booked-border); 
        }

        .slot-time { 
            font-weight: 600; 
            font-size: 0.9rem; 
            color: var(--text-dark); 
        }

        .btn { 
            padding: 8px 14px; 
            border-radius: 8px; 
            border: none; 
            font-weight: 600; 
            cursor: pointer; 
            font-size: 0.825rem; 
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-book { 
            background: var(--primary); 
            color: white; 
        }

        .btn-book:hover { 
            background: var(--primary-hover); 
            transform: translateY(-1px);
        }

        .btn-cancel { 
            background: #fee2e2; 
            color: var(--danger); 
            margin-left: 6px; 
        }

        .btn-cancel:hover { 
            background: #fca5a5; 
        }

        .btn-remind { 
            background: #ecfdf5; 
            color: #059669; 
        }

        .btn-remind:hover {
            background: #d1fae5;
        }

        .patient-info { 
            font-size: 0.825rem; 
            color: var(--text-muted); 
            margin-top: 4px; 
            display: flex; 
            flex-direction: column; 
            gap: 2px; 
        }

        .patient-name {
            font-weight: 600;
            color: var(--text-dark);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-card">
        <div class="brand">
            <div class="brand-icon">┼</div>
            <div>
                <h1 class="header-title">The Wellness Centre</h1>
                <p class="header-sub">Physiotherapy Appointments & Practitioner Schedules</p>
            </div>
        </div>
        <div class="booked-badge">
            <span class="pulse-dot"></span>
            <span id="totalBookedCount">0</span> Appointments Booked
        </div>
    </div>
    <div id="app" class="app-grid"></div>
</div>

<script>
    localStorage.removeItem("saved_therapist_schedules");

    const therapists = [
        { name: "Chido", role: "Physiotherapist", slots: ["08:00 AM", "09:00 AM", "10:00 AM", "11:00 AM", "12:00 PM", "01:00 PM", "02:00 PM", "03:00 PM", "04:00 PM"] },
        { name: "Mispar", role: "Physiotherapist", slots: ["08:00 AM", "09:00 AM", "10:00 AM", "11:00 AM", "12:00 PM", "01:00 PM", "02:00 PM", "03:00 PM", "04:00 PM"] },
        { name: "Tinotenda", role: "Physiotherapist", slots: ["08:00 AM", "09:00 AM", "10:00 AM", "11:00 AM", "12:00 PM", "01:00 PM", "02:00 PM", "03:00 PM", "04:00 PM"] }
    ];

    let bookingsList = [];

    function updateBookingCount() {
        document.getElementById("totalBookedCount").textContent = bookingsList.length;
    }

    async function loadSlots() {
        try {
            const res = await fetch("/api/bookings");
            if (res.ok) {
                const data = await res.json();
                if (Array.isArray(data)) bookingsList = data;
            }
        } catch (e) {}
        renderColumns(therapists);
    }

    async function bookSlot(practitioner, slot) {
        const name = prompt("Enter Patient Name:");
        if (!name) return;
        const phone = prompt("Enter Phone Number:") || "";
        const booking = { practitioner, therapist: practitioner, slot, time: slot, name, phone };
        
        bookingsList.push(booking);
        renderColumns(therapists);

        try {
            await fetch('/api/bookings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(booking)
            });
        } catch (err) {
            console.error(err);
        }
    }

    async function cancelBooking(practitioner, slot) {
        if (!confirm("Cancel booking at " + slot + " for " + practitioner + "?")) return;
        bookingsList = bookingsList.filter(b => !(
            (b.practitioner === practitioner || b.therapist === practitioner) &&
            (b.slot === slot || b.time === slot)
        ));
        renderColumns(therapists);

        try {
            await fetch('/api/bookings/cancel', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ practitioner, slot })
            });
        } catch (err) {
            console.error(err);
        }
    }

    function renderColumns(data) {
        updateBookingCount();
        const app = document.getElementById("app");
        app.innerHTML = "";
        data.forEach(p => {
            const card = document.createElement("div");
            card.className = "card";
            
            let slotsHTML = "";
            p.slots.forEach(slot => {
                const booking = bookingsList.find(b => 
                    (b.practitioner === p.name || b.therapist === p.name) && 
                    (b.slot === slot || b.time === slot)
                );
                if (booking) {
                    slotsHTML += `
                        <div class="slot-card booked">
                            <div>
                                <div class="slot-time">${slot}</div>
                                <div class="patient-info">
                                    <span class="patient-name">👤 ${booking.name}</span>
                                    ${booking.phone ? `<span>📱 ${booking.phone}</span>` : ''}
                                </div>
                            </div>
                            <div>
                                <button class="btn btn-remind">Remind</button>
                                <button class="btn btn-cancel" onclick="cancelBooking('${p.name}', '${slot}')">Cancel</button>
                            </div>
                        </div>`;
                } else {
                    slotsHTML += `
                        <div class="slot-card">
                            <div class="slot-time">${slot}</div>
                            <button class="btn btn-book" onclick="bookSlot('${p.name}', '${slot}')">+ Book Slot</button>
                        </div>`;
                }
            });

            card.innerHTML = `
                <div class="practitioner-header">
                    <div class="avatar">${p.name.charAt(0)}</div>
                    <div class="practitioner-info">
                        <h3 class="practitioner-name">${p.name}</h3>
                        <div class="practitioner-role">${p.role}</div>
                    </div>
                </div>
                <div class="slots-container">
                    ${slotsHTML}
                </div>`;
            app.appendChild(card);
        });
    }

    loadSlots();
    setInterval(loadSlots, 3000);
</script>
</body>
</html>
