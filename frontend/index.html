<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wellness Centre — Appointment Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f8fafc;
            --surface: #ffffff;
            --primary: #0f766e;
            --primary-hover: #0d9488;
            --primary-light: #ccfbf1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --booked-bg: #f0fdf4;
            --booked-border: #bbf7d0;
            --booked-text: #166534;
            --blocked-bg: #fff1f2;
            --blocked-border: #fecdd3;
            --blocked-text: #9f1239;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.05);
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg-main); color: var(--text-main); padding: 24px; min-height: 100vh; }

        .header { display: flex; justify-content: space-between; align-items: center; background: var(--surface); padding: 16px 24px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); border: 1px solid var(--border-light); margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
        .logo { font-size: 1.25rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 10px; letter-spacing: -0.02em; }
        .logo-icon { background: var(--primary-light); color: var(--primary); width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
        
        .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .search-box { position: relative; display: flex; align-items: center; }
        .search-box input { padding: 9px 14px 9px 38px; border: 1px solid var(--border-light); border-radius: var(--radius-md); font-size: 0.9rem; outline: none; transition: all 0.2s; background: #f8fafc; }
        .search-box input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12); }
        .search-icon { position: absolute; left: 12px; color: var(--text-muted); font-size: 0.9rem; pointer-events: none; }

        .btn { padding: 9px 16px; border: none; border-radius: var(--radius-md); cursor: pointer; font-weight: 600; font-size: 0.875rem; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-secondary { background: #f1f5f9; color: #334155; border: 1px solid #e2e8f0; }
        .btn-secondary:hover { background: #e2e8f0; }
        .btn-success { background: #10b981; color: #fff; }
        .btn-success:hover { background: #059669; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        .btn-whatsapp { background: #25D366; color: #fff; font-size: 0.78rem; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-weight: 600; box-shadow: 0 2px 4px rgba(37,211,102,0.2); }
        .btn-whatsapp:hover { background: #1eb954; transform: translateY(-1px); }

        .date-picker-container { display: flex; align-items: center; gap: 12px; background: var(--surface); padding: 12px 20px; border-radius: var(--radius-lg); margin-bottom: 24px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-light); width: fit-content; }
        input[type="date"], input[type="text"], input[type="tel"], select { padding: 9px 12px; border: 1px solid var(--border-light); border-radius: var(--radius-md); font-size: 0.9rem; outline: none; transition: all 0.2s; }
        input[type="date"]:focus, input[type="text"]:focus, input[type="tel"]:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12); }
        .date-display { font-weight: 700; color: var(--text-main); font-size: 0.95rem; margin-left: 6px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
        .card { background: var(--surface); border-radius: var(--radius-lg); padding: 22px; box-shadow: var(--shadow-md); border: 1px solid var(--border-light); }
        .card-header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; border-bottom: 1px solid var(--border-light); padding-bottom: 14px; }
        .avatar { width: 44px; height: 44px; border-radius: 12px; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.1rem; }
        
        .slot { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border: 1px solid var(--border-light); border-radius: var(--radius-md); margin-bottom: 10px; background: #fafafa; transition: all 0.15s; }
        .slot:hover { border-color: #cbd5e1; background: #fff; }
        .slot.booked { background: var(--booked-bg); border-color: var(--booked-border); }
        .slot.blocked { background: var(--blocked-bg); border-color: var(--blocked-border); color: var(--blocked-text); }
        .slot-time { font-weight: 700; font-size: 0.88rem; color: #334155; }
        .slot-actions { display: flex; gap: 8px; align-items: center; }

        .holiday-banner { background: #fff1f2; color: #9f1239; border: 1px solid #fecdd3; padding: 14px 20px; border-radius: var(--radius-lg); margin-bottom: 24px; text-align: center; font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; gap: 8px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.45); backdrop-filter: blur(4px); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: var(--surface); padding: 28px; border-radius: 20px; width: 100%; max-width: 440px; position: relative; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1); border: 1px solid var(--border-light); }
        .form-group { margin-bottom: 18px; position: relative; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; font-weight: 600; color: #475569; }
        .form-group input, .form-group select { width: 100%; }

        .autocomplete-wrapper { position: relative; width: 100%; }
        .autocomplete-results { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid var(--border-light); border-top: none; border-radius: 0 0 var(--radius-md) var(--radius-md); max-height: 220px; overflow-y: auto; z-index: 1050; box-shadow: var(--shadow-md); display: none; }
        .autocomplete-item { padding: 10px 14px; cursor: pointer; font-size: 0.88rem; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; transition: background 0.15s; }
        .autocomplete-item:hover { background-color: #f1f5f9; }
        .autocomplete-item .phone-tag { color: var(--text-muted); font-size: 0.8rem; font-weight: 500; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">
            <div class="logo-icon">✚</div>
            <span>The Wellness Centre</span>
        </div>
        <div class="controls">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search patient..." onkeyup="filterSchedule()">
            </div>
            <button class="btn btn-secondary" onclick="openBlockModal()">🚫 Block Time</button>
            <button class="btn btn-success" onclick="document.getElementById('csvFileInput').click()">📥 Import CSV</button>
            <input type="file" id="csvFileInput" accept=".csv" style="display:none;" onchange="handleCSVImport(event)">
            <button class="btn btn-danger" onclick="clearLocalContacts()" title="Wipe saved local contacts">🗑️ Clear</button>
        </div>
    </div>

    <div class="date-picker-container">
        <button class="btn btn-secondary" onclick="changeDate(-1)">◀</button>
        <button class="btn btn-secondary" onclick="setToday()">Today</button>
        <button class="btn btn-secondary" onclick="changeDate(1)">▶</button>
        <input type="date" id="datePicker" onchange="loadSchedule()">
        <span id="dateDisplay" class="date-display"></span>
    </div>

    <div id="holidayBannerContainer"></div>
    <div class="grid" id="practitionerGrid"></div>

    <!-- Booking Modal -->
    <div class="modal" id="bookingModal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="margin: 0; font-size: 1.15rem; color: #0f172a;">Book Appointment</h3>
                <button type="button" class="btn btn-secondary" onclick="pickFromPhonebook()" title="Pick contact from phone address book">📱 Pick Contact</button>
            </div>
            <form id="bookingForm" onsubmit="handleBookSubmit(event)">
                <input type="hidden" id="bookPractitioner">
                <input type="hidden" id="bookSlot">
                <div class="form-group">
                    <label>Patient Name</label>
                    <div class="autocomplete-wrapper">
                        <input type="text" id="patientName" oninput="onPatientInput(this.value)" onfocus="onPatientInput(this.value)" placeholder="Type patient name..." required autocomplete="off">
                        <div id="autocompleteResults" class="autocomplete-results"></div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="patientPhone" placeholder="0777203606 or +263777203606">
                </div>
                <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('bookingModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Booking</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Block Modal -->
    <div class="modal" id="blockModal">
        <div class="modal-content">
            <h3 style="margin-bottom: 20px; font-size: 1.15rem; color: #0f172a;">Block Slot / Time Off</h3>
            <form id="blockForm" onsubmit="handleBlockSubmit(event)">
                <div class="form-group">
                    <label>Practitioner</label>
                    <select id="blockPractitionerSelect">
                        <option value="Chido">Chido</option>
                        <option value="Mispar">Mispar</option>
                        <option value="Tinotenda">Tinotenda</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Slot</label>
                    <select id="blockSlotSelect">
                        <option value="08:00 AM">08:00 AM</option>
                        <option value="09:00 AM">09:00 AM</option>
                        <option value="10:00 AM">10:00 AM</option>
                        <option value="11:00 AM">11:00 AM</option>
                        <option value="12:00 PM">12:00 PM</option>
                        <option value="01:00 PM">01:00 PM</option>
                        <option value="02:00 PM">02:00 PM</option>
                        <option value="03:00 PM">03:00 PM</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Reason</label>
                    <input type="text" id="blockReason" placeholder="Lunch, Away, etc.">
                </div>
                <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('blockModal')">Cancel</button>
                    <button type="submit" class="btn btn-danger">Block Slot</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin.includes('onrender.com') 
            ? `${window.location.origin}/api` 
            : 'https://wellness-portal-api.onrender.com/api';

        const practitioners = [
            { name: 'Chido', title: 'Physiotherapist' },
            { name: 'Mispar', title: 'Physiotherapist' },
            { name: 'Tinotenda', title: 'Physiotherapist' }
        ];
        const timeSlots = ['08:00 AM', '09:00 AM', '10:00 AM', '11:00 AM', '12:00 PM', '01:00 PM', '02:00 PM', '03:00 PM'];
        
        let rawScheduleData = { bookings: [], blocks: [] };
        let phonebookDirectory = [];

        const ZIM_HOLIDAYS_2026 = {
            '2026-01-01': "New Year's Day", '2026-02-21': "National Youth Day", '2026-04-03': "Good Friday",
            '2026-04-06': "Easter Monday", '2026-04-18': "Independence Day", '2026-05-01': "Workers' Day",
            '2026-05-25': "Africa Day", '2026-08-10': "Heroes' Day", '2026-08-11': "Defence Forces Day",
            '2026-09-15': "Munhumutapa Day", '2026-12-22': "National Unity Day", '2026-12-25': "Christmas Day",
            '2026-12-26': "Boxing Day"
        };

        document.addEventListener('DOMContentLoaded', () => {
            setToday();
            loadPatientDirectory();

            const phoneInput = document.getElementById('patientPhone');
            if (phoneInput) {
                phoneInput.addEventListener('input', (e) => {
                    let val = e.target.value.trim();
                    if (val.startsWith('0') && val.length > 1) {
                        e.target.value = '+263 ' + val.substring(1);
                    }
                });
            }

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.autocomplete-wrapper')) {
                    hideAutocomplete();
                }
            });
        });

        async function loadPatientDirectory() {
            let localPatients = JSON.parse(localStorage.getItem('local_patient_directory') || '[]');
            phonebookDirectory = localPatients;

            try {
                const res = await fetch(`${API_URL}/patients`);
                if (res.ok) {
                    const serverPatients = await res.json();
                    const combinedMap = new Map();
                    [...localPatients, ...serverPatients].forEach(p => {
                        if (p && (p.name || p.phone)) {
                            const key = ((p.name || '') + '_' + (p.phone || '')).toLowerCase().trim();
                            if (key) combinedMap.set(key, p);
                        }
                    });
                    phonebookDirectory = Array.from(combinedMap.values());
                }
            } catch (err) {
                console.warn('Using local cache:', err);
            }
        }

        function handleCSVImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split(/\r?\n/);
                let importedCount = 0;
                let existing = JSON.parse(localStorage.getItem('local_patient_directory') || '[]');

                lines.forEach(line => {
                    let trimmed = line.trim();
                    if (!trimmed) return;

                    let parts = trimmed.match(/(".*?"|[^",;]+)(?=\s*[,;]|\s*$)/g) || trimmed.split(/[,;]/);
                    
                    if (parts && parts.length >= 1) {
                        let name = parts[0].replace(/^["']|["']$/g, '').trim();
                        let phone = parts[1] ? parts[1].replace(/^["']|["']$/g, '').trim() : '';
                        
                        const lowerName = name.toLowerCase();
                        if (name && lowerName !== 'name' && lowerName !== 'first name' && lowerName !== 'display name') {
                            existing.push({ name, phone });
                            importedCount++;
                        }
                    }
                });

                const uniqueMap = new Map();
                existing.forEach(p => {
                    if (p && p.name) {
                        const key = (p.name + '_' + (p.phone || '')).toLowerCase().trim();
                        uniqueMap.set(key, p);
                    }
                });

                const cleanList = Array.from(uniqueMap.values());
                localStorage.setItem('local_patient_directory', JSON.stringify(cleanList));
                loadPatientDirectory();
                alert(`Successfully processed ${importedCount} lines! Directory updated (${cleanList.length} total contacts).`);
            };
            reader.readAsText(file);
        }

        function renderAutocomplete(matches) {
            const container = document.getElementById('autocompleteResults');
            if (!container) return;

            if (matches.length === 0) {
                container.style.display = 'none';
                return;
            }

            let html = matches.map(p => {
                const safeName = (p.name || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const safePhone = (p.phone || '').replace(/'/g, "\\'");
                return `
                    <div class="autocomplete-item" onclick="selectPatient('${safeName}', '${safePhone}')">
                        <span><strong>${p.name || 'Unnamed'}</strong></span>
                        <span class="phone-tag">${p.phone || ''}</span>
                    </div>
                `;
            }).join('');

            container.innerHTML = html;
            container.style.display = 'block';
        }

        function hideAutocomplete() {
            const container = document.getElementById('autocompleteResults');
            if (container) container.style.display = 'none';
        }

        function onPatientInput(value) {
            const q = (value || '').trim().toLowerCase();
            if (!q) {
                hideAutocomplete();
                return;
            }

            const terms = q.split(/\s+/);
            const matches = phonebookDirectory.filter(p => {
                const nameLower = (p.name || '').toLowerCase();
                const phoneClean = (p.phone || '').replace(/[^0-9]/g, '');
                const qClean = q.replace(/[^0-9]/g, '');

                const matchName = terms.every(t => nameLower.includes(t));
                const matchPhone = qClean.length >= 2 && phoneClean.includes(qClean);
                return matchName || matchPhone;
            }).slice(0, 30);

            renderAutocomplete(matches);
        }

        function selectPatient(name, phone) {
            document.getElementById('patientName').value = name;
            document.getElementById('patientPhone').value = phone || '';
            hideAutocomplete();
        }

        function clearLocalContacts() {
            if (confirm('Clear all local saved contacts and start fresh?')) {
                localStorage.removeItem('local_patient_directory');
                phonebookDirectory = [];
                hideAutocomplete();
                alert('Saved contacts cleared!');
                window.location.reload();
            }
        }

        async function pickFromPhonebook() {
            if ('contacts' in navigator && 'ContactsManager' in window) {
                try {
                    const contacts = await navigator.contacts.select(['name', 'tel'], { multiple: false });
                    if (contacts && contacts[0]) {
                        if (contacts[0].name?.[0]) {
                            const nameVal = contacts[0].name[0];
                            document.getElementById('patientName').value = nameVal;
                            onPatientInput(nameVal);
                        }
                        if (contacts[0].tel?.[0]) {
                            const phoneInput = document.getElementById('patientPhone');
                            phoneInput.value = contacts[0].tel[0];
                            phoneInput.dispatchEvent(new Event('input'));
                        }
                    }
                } catch (err) { console.error(err); }
            } else {
                alert('Contact picker works on mobile browsers.');
            }
        }

        function setToday() {
            const today = new Date();
            document.getElementById('datePicker').value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            loadSchedule();
        }

        function changeDate(days) {
            const picker = document.getElementById('datePicker');
            const parts = picker.value.split('-');
            const current = new Date(parts[0], parts[1] - 1, parts[2]);
            current.setDate(current.getDate() + days);
            picker.value = `${current.getFullYear()}-${String(current.getMonth() + 1).padStart(2, '0')}-${String(current.getDate()).padStart(2, '0')}`;
            loadSchedule();
        }

        function formatDisplayDate(dateStr) {
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                return new Date(parts[0], parts[1] - 1, parts[2]).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
            }
            return dateStr;
        }

        function cleanSlot(s) { return s ? String(s).replace(/^0/, '') : ''; }

        function sanitizePhoneNumber(phone) {
            if (!phone) return '';
            let digits = String(phone).replace(/[^0-9]/g, '');
            if (digits.startsWith('0')) digits = '263' + digits.substring(1);
            else if (digits.length === 9 && digits.startsWith('7')) digits = '263' + digits;
            return digits;
        }

        function formatWhatsAppUrl(phone, name, practitioner, date, slot) {
            const cleanPhone = sanitizePhoneNumber(phone);
            if (!cleanPhone) return '#';
            return `https://wa.me/${cleanPhone}?text=${encodeURIComponent(`Hi ${name}, your appointment at The Wellness Centre with ${practitioner} is confirmed for ${date} at ${slot}.`)}`;
        }

        async function loadSchedule() {
            const dateStr = document.getElementById('datePicker').value;
            document.getElementById('dateDisplay').innerText = formatDisplayDate(dateStr);
            try {
                const res = await fetch(`${API_URL}/schedule`);
                const data = await res.json();
                rawScheduleData = { bookings: Array.isArray(data.bookings) ? data.bookings : [], blocks: Array.isArray(data.blocks) ? data.blocks : [] };
                renderGrid(rawScheduleData, dateStr);
            } catch (err) {
                renderGrid({ bookings: [], blocks: [] }, dateStr);
            }
        }

        function renderGrid(data, selectedDate) {
            const grid = document.getElementById('practitionerGrid');
            const holidayBanner = document.getElementById('holidayBannerContainer');
            grid.innerHTML = '';
            holidayBanner.innerHTML = '';

            const holidayName = ZIM_HOLIDAYS_2026[selectedDate];
            if (holidayName) holidayBanner.innerHTML = `<div class="holiday-banner">🌴 Public Holiday: ${holidayName} (Centre Closed)</div>`;

            const query = (document.getElementById('searchInput').value || '').toLowerCase();
            const parts = selectedDate.split('-');
            const altDate1 = `${parts[2]}/${parts[1]}/${parts[0]}`; 
            const altDate2 = `${parseInt(parts[2])}/${parseInt(parts[1])}/${parts[0]}`;

            const blocksList = Array.isArray(data.blocks) ? data.blocks : [];
            const bookingsList = Array.isArray(data.bookings) ? data.bookings : [];

            practitioners.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                let slotsHtml = '';

                timeSlots.forEach(slot => {
                    if (holidayName) {
                        slotsHtml += `<div class="slot blocked"><span class="slot-time">${slot}</span><span>🚫 Public Holiday (${holidayName})</span></div>`;
                        return;
                    }

                    const block = blocksList.find(b => b && b.practitioner?.toLowerCase() === p.name.toLowerCase() && cleanSlot(b.slot) === cleanSlot(slot) && (b.date === selectedDate || b.date === altDate1 || b.date === altDate2));
                    const booking = bookingsList.find(b => b && b.practitioner?.toLowerCase() === p.name.toLowerCase() && cleanSlot(b.slot) === cleanSlot(slot) && (b.date === selectedDate || b.date === altDate1 || b.date === altDate2));

                    if (query && booking && booking.name && !booking.name.toLowerCase().includes(query)) return;

                    if (block) {
                        slotsHtml += `<div class="slot blocked"><span class="slot-time">${slot}</span><span>🚫 ${block.reason || 'Closed'}</span><button class="btn btn-secondary" style="font-size: 0.78rem; padding: 4px 8px;" onclick="deleteBlock('${p.name}', '${slot}')">Unblock</button></div>`;
                    } else if (booking) {
                        slotsHtml += `<div class="slot booked"><span class="slot-time">${slot}</span><span>👤 ${booking.name}</span><div class="slot-actions">${booking.phone ? `<a href="${formatWhatsAppUrl(booking.phone, booking.name, p.name, selectedDate, slot)}" target="_blank" rel="noopener noreferrer" class="btn btn-whatsapp">💬 WhatsApp</a>` : ''}<button class="btn btn-danger" style="font-size: 0.78rem; padding: 4px 8px;" onclick="cancelBooking('${p.name}', '${slot}')">Cancel</button></div></div>`;
                    } else {
                        if (query) return;
                        slotsHtml += `<div class="slot"><span class="slot-time">${slot}</span><button class="btn btn-primary" style="font-size: 0.8rem; padding: 5px 12px;" onclick="openBookingModal('${p.name}', '${slot}')">+ Book</button></div>`;
                    }
                });

                card.innerHTML = `<div class="card-header"><div class="avatar">${p.name[0]}</div><div><h3 style="margin:0; font-size: 1.1rem; color: #0f172a;">${p.name}</h3><small style="color:#64748b; font-weight: 500;">${p.title}</small></div></div><div>${slotsHtml || '<p style="color:#888; text-align:center; padding: 20px 0;">No matching records found.</p>'}</div>`;
                grid.appendChild(card);
            });
        }

        function filterSchedule() { renderGrid(rawScheduleData, document.getElementById('datePicker').value); }
        function openBookingModal(practitioner, slot) {
            document.getElementById('bookPractitioner').value = practitioner;
            document.getElementById('bookSlot').value = slot;
            document.getElementById('bookingModal').style.display = 'flex';
            setTimeout(() => {
                const nameInput = document.getElementById('patientName');
                if (nameInput) nameInput.focus();
            }, 100);
        }
        function openBlockModal() { document.getElementById('blockModal').style.display = 'flex'; }
        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
            hideAutocomplete();
        }

        async function handleBookSubmit(e) {
            e.preventDefault();
            const date = document.getElementById('datePicker').value;
            const practitioner = document.getElementById('bookPractitioner').value;
            const slot = document.getElementById('bookSlot').value;
            const name = document.getElementById('patientName').value;
            const phone = sanitizePhoneNumber(document.getElementById('patientPhone').value);

            await fetch(`${API_URL}/bookings`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ practitioner, slot, name, phone, date })
            });

            closeModal('bookingModal');
            document.getElementById('bookingForm').reset();
            loadSchedule();
        }

        async function handleBlockSubmit(e) {
            e.preventDefault();
            const date = document.getElementById('datePicker').value;
            const practitioner = document.getElementById('blockPractitionerSelect').value;
            const slot = document.getElementById('blockSlotSelect').value;
            const reason = document.getElementById('blockReason').value || 'Away';

            await fetch(`${API_URL}/block`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ practitioner, slot, date, reason })
            });

            closeModal('blockModal');
            document.getElementById('blockForm').reset();
            loadSchedule();
        }

        async function cancelBooking(practitioner, slot) {
            const date = document.getElementById('datePicker').value;
            await fetch(`${API_URL}/bookings`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ practitioner, slot, date })
            });
            loadSchedule();
        }

        async function deleteBlock(practitioner, slot) {
            const date = document.getElementById('datePicker').value;
            await fetch(`${API_URL}/block`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ practitioner, slot, date })
            });
            loadSchedule();
        }
    </script>
</body>
</html>
