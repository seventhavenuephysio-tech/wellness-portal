<script>
        const API_BASE_URL = "https://wellness-backend-a92z.onrender.com";

        // Helper function to format any date into clean YYYY-MM-DD
        function cleanDateString(dateVal) {
            if (!dateVal) return "";
            // Handle ISO string format from MongoDB (e.g., 2026-08-14T00:00:00.000Z)
            return dateVal.toString().split("T")[0];
        }

        async function checkServerStatus() {
            const badge = document.getElementById("statusBadge");
            badge.innerText = "Checking...";
            badge.className = "status-badge status-offline";
            try {
                const response = await fetch(API_BASE_URL + "/");
                const data = await response.json();
                if (data.status === "online" && data.dbConnected) {
                    badge.innerText = "Database Online 🟢";
                    badge.className = "status-badge status-online";
                } else {
                    badge.innerText = "Database Offline 🔴";
                    badge.className = "status-badge status-offline";
                }
            } catch (error) {
                console.error("Error connecting to backend:", error);
                badge.innerText = "Backend Offline 🔴";
                badge.className = "status-badge status-offline";
            }
        }

        async function fetchAndRenderBookings() {
            try {
                const response = await fetch(API_BASE_URL + "/api/bookings");
                if (response.ok) {
                    const bookings = await response.json();
                    const currentDate = cleanDateString(document.getElementById("diaryDate").value);

                    // 1. Reset all buttons to default available state
                    document.querySelectorAll(".slot button").forEach(btn => {
                        btn.disabled = false;
                        btn.innerText = "BOOK";
                        btn.style.backgroundColor = "#1a73e8";
                    });

                    // 2. Filter bookings matching the selected date
                    bookings.forEach(b => {
                        const bookingDate = cleanDateString(b.date);

                        if (bookingDate === currentDate) {
                            const cards = document.querySelectorAll(".therapist-card");
                            cards.forEach(card => {
                                const therapistName = card.querySelector("h3").innerText.trim().toLowerCase();
                                const bookingTherapist = (b.therapist || "").trim().toLowerCase();

                                if (therapistName === bookingTherapist) {
                                    const slots = card.querySelectorAll(".slot");
                                    slots.forEach(slot => {
                                        const timeText = slot.querySelector("span").innerText.trim().toLowerCase();
                                        const bookingTime = (b.time || "").trim().toLowerCase();

                                        if (timeText === bookingTime) {
                                            const btn = slot.querySelector("button");
                                            btn.disabled = true;
                                            btn.innerText = `Booked (${b.patientName})`;
                                            btn.style.backgroundColor = "#888";
                                        }
                                    });
                                }
                            });
                        }
                    });
                }
            } catch (error) {
                console.error("Failed to fetch bookings:", error);
            }
        }

        async function bookSlot(therapist, time) {
            const rawDate = document.getElementById("diaryDate").value;
            const date = cleanDateString(rawDate);
            
            const patientName = prompt(`Enter patient name for ${therapist} at ${time}:`);
            if (!patientName) return;

            try {
                const response = await fetch(API_BASE_URL + "/api/bookings", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ therapist, time, date, patientName })
                });

                if (response.ok) {
                    alert(`Booking confirmed for ${patientName} with ${therapist} at ${time}`);
                    fetchAndRenderBookings(); // Refresh interface immediately
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    alert(`Booking failed: ${errorData.error || 'Server error'}`);
                }
            } catch (error) {
                console.error("Error saving booking:", error);
                alert("Server error when attempting to book.");
            }
        }

        window.onload = function() {
            checkServerStatus();
            fetchAndRenderBookings();
        };
    </script>
