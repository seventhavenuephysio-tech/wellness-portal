<script>
  // Correct Live Render Backend Endpoint
  const API_URL = "https://wellness-portal-backend.onrender.com";

  // 1. Sync & Health Check (FETCH ALL BOOKINGS)
  async function syncDatabase() {
    const statusBadge = document.getElementById('status-badge');
    if (statusBadge) statusBadge.innerText = 'Connecting... ⏳';

    try {
      const response = await fetch(`${API_URL}/api/bookings`);
      
      if (response.ok) {
        const data = await response.json();
        console.log('Connected to backend! Bookings:', data);
        
        if (statusBadge) {
          statusBadge.innerText = 'Database Online 🟢';
          statusBadge.classList.add('online');
          statusBadge.style.backgroundColor = '#e6ffe6';
          statusBadge.style.color = '#2e7d32';
        }
      } else {
        throw new Error(`Server returned status ${response.status}`);
      }
    } catch (error) {
      console.error('Connection failed:', error);
      if (statusBadge) {
        statusBadge.innerText = 'Database Offline 🔴';
        statusBadge.classList.remove('online');
        statusBadge.style.backgroundColor = '#ffe6e6';
        statusBadge.style.color = '#d9534f';
      }
    }
  }

  // 2. Create / Save New Booking (MISSING PIECE ADDED HERE ➕)
  async function createBooking(therapist, time, date, clientName) {
    try {
      const response = await fetch(`${API_URL}/api/bookings`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ therapist, time, date, clientName })
      });

      if (!response.ok) {
        const errData = await response.json();
        throw new Error(errData.error || `Server returned status ${response.status}`);
      }

      const result = await response.json();
      console.log('Booking saved successfully:', result);
      
      // Refresh the diary view and status
      syncDatabase();
    } catch (error) {
      console.error('Booking Error:', error);
      alert('Network error! Unable to reach backend server.');
    }
  }

  // 3. Edit / Update Booking Request
  async function updateBooking(bookingId, updatedData) {
    try {
      const response = await fetch(`${API_URL}/api/bookings/${bookingId}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(updatedData)
      });

      if (!response.ok) {
        throw new Error(`Server returned status ${response.status}`);
      }

      const result = await response.json();
      console.log('Update successful:', result);
      
      // Refresh database status and diary view
      syncDatabase();
    } catch (error) {
      console.error('Edit error:', error);
      alert('Unable to reach backend to update booking.');
    }
  }

  // 4. Delete / Cancel Booking Request
  async function deleteBooking(bookingId) {
    try {
      const response = await fetch(`${API_URL}/api/bookings/${bookingId}`, {
        method: 'DELETE'
      });

      if (!response.ok) {
        throw new Error(`Server returned status ${response.status}`);
      }

      console.log('Booking deleted');
      syncDatabase();
    } catch (error) {
      console.error('Delete error:', error);
      alert('Unable to cancel booking.');
    }
  }

  // Event Listeners Initialization
  document.addEventListener('DOMContentLoaded', () => {
    const syncBtn = document.getElementById('sync-btn');
    if (syncBtn) {
      syncBtn.addEventListener('click', syncDatabase);
    }
    
    // Auto-run connection check on load
    syncDatabase();
  });
</script>
