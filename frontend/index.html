<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wellness Centre — Physiotherapy Booking Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 50%, #e2e8f0 100%);
            --surface: #ffffff;
            --surface-glass: rgba(255, 255, 255, 0.88);
            --primary: #0284c7;
            --primary-gradient: linear-gradient(135deg, #0284c7 0%, #0d9488 100%);
            --primary-dark: #0369a1;
            --primary-light: #e0f2fe;
            --accent: #0f766e;
            --accent-light: #ccfbf1;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --border-hover: #cbd5e1;
            --shadow-sm: 0 2px 4px rgba(15, 23, 42, 0.03);
            --shadow-md: 0 8px 16px -2px rgba(15, 23, 42, 0.06);
            --shadow-lg: 0 20px 25px -5px rgba(15, 23, 42, 0.08);
            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
        
        body { 
            background: var(--bg-gradient); 
            color: var(--text-dark); 
            min-height: 100vh; 
            padding-bottom: 60px;
            -webkit-font-smoothing: antialiased;
        }

        /* Glass Navbar */
        .navbar {
            background: var(--surface-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 16px 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }

        .brand { display: flex; align-items: center; gap: 14px; }
        .brand-logo {
            width: 44px;
            height: 44px;
            background: var(--primary-gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 1.25rem;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
        }

        .brand-text h1 { font-size: 1.25rem; font-weight: 800; color: var(--text-dark); letter-spacing: -0.02em; line-height: 1.2; }
        .brand-text p { font-size: 0.725rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }

        .nav-widgets { display: flex; align-items: center; gap: 12px; }
        .badge-chip {
            background: #ffffff;
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 0.825rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-sm);
        }
        .badge-chip.active { background: var(--primary-light); color: var(--primary-dark); border-color: #bae6fd; }
        .pulse-indicator { width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); animation: pulse 2s infinite; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Container */
        .main-container { max-width: 1380px; margin: 32px auto; padding: 0 24px; }

        /* Controls / Filter & Calendar Bar */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            gap: 16px;
            background: var(--surface);
            padding: 14px 20px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            flex-wrap: wrap;
        }

        .search-wrapper { position: relative; width: 280px; }
        .search-wrapper input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            font-size: 0.875rem;
            outline: none;
            transition: all 0.2s ease;
            background: #f8fafc;
        }
        .search-wrapper input:focus {
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
        }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.9rem; }

        /* Active Calendar Bar Controls */
        .calendar-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .date-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f8fafc;
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
        }

        .date-picker-wrapper label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .date-picker-wrapper input[type="date"] {
            border: none;
            background: transparent;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.875rem;
            color: var(--text-dark);
            outline: none;
            cursor: pointer;
        }

        .btn-nav-date {
            background: #f1f5f9;
            border: 1px solid var(--border);
            color: var(--text-dark);
            font-weight: 700;
            font-size: 0.85rem;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-nav-date:hover {
            background: var(--primary-light);
            color: var(--primary-dark);
            border-color: #bae6fd;
        }

        .date-display-badge {
            font-size: 0.875rem;
            font-weight: 800;
            color: var(--primary-dark);
            background: var(--primary-light);
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid #bae6fd;
        }

        /* Fixed 3-Column Practitioner Grid Layout */
        .therapist-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .therapist-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Practitioner Card / Column */
        .therapist-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .therapist-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .card-header {
            padding: 22px 24px;
            background: linear-gradient(180deg, #ffffff 0%, #fafafa 100%);
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        .header-top { display: flex; align-items: center; gap: 14px; }
        
        .avatar-circle {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--primary-gradient);
            color: white;
            font-size: 1.25rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.25);
            border: 3px solid white;
        }

        .profile-meta h3 { font-size: 1.15rem; font-weight: 800; color: var(--text-dark); letter-spacing: -0.01em; }
        .profile-meta p { font-size: 0.825rem; color: var(--text-muted); font-weight: 600; margin-top: 2px; }

        .occupancy-bar-container { margin-top: 16px; }
        .occupancy-labels { display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }
        .progress-track { height: 6px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary-gradient); border-radius: 999px; transition: width 0.4s ease; }

        /* Slots List Inside Column */
        .slots-body { padding: 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }

        .slot-pill {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: #ffffff;
            transition: all 0.2s ease;
        }
        .slot-pill:hover { border-color: var(--border-hover); background: #f8fafc; }
        .slot-pill.booked { background: #f8fafc; border-color: #cbd5e1; }

        .time-label { font-weight: 700; font-size: 0.875rem; color: var(--text-dark); }
        
        .patient-card-info { margin-top: 3px; font-size: 0.78rem; color: var(--text-muted); line-height: 1.3; }
        .patient-name-tag { font-weight: 700; color: var(--text-dark); }

        /* Buttons */
        .btn-action {
            border: none;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 0.825rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-book { background: var(--primary-gradient); color: white; box-shadow: 0 2px 6px rgba(2, 132, 199, 0.2); }
        .btn-book:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35); }

        .btn-cancel { background: #fee2e2; color: #dc2626; }
        .btn-cancel:hover { background: #fca5a5; }

        /* Modal Overlay */
        .modal-backdrop {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-backdrop.active { display: flex; }

        .modal-box {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: var(--radius-lg);
            padding: 28px;
            box-shadow: var(--shadow-lg);
            animation: modalSlide 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid var(--border);
        }

        @keyframes modalSlide {
            from { opacity: 0; transform: translateY(12px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 1.2rem; font-weight: 800; color: var(--text-dark); }
        .btn-close { background: #f1f5f9; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; color: var(--text-muted); }

        .form-field { margin-bottom: 16px; }
        .form-field label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-dark); margin-bottom: 6px; }
        .form-field input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s ease;
        }
        .form-field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }

        .modal-footer { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }

        /* Toast Notification */
        .toast-notification {
            position: fixed;
            bottom: 28px;
            right: 28px;
            background: #0f172a;
            color: #ffffff;
            padding: 14px 22px;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 700;
            box-shadow: var(--shadow-lg);
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 2000;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="brand">
        <div class="brand-logo">┼</div>
        <div class="brand-text">
            <h1>The Wellness Centre</h1>
            <p>PHYSIOTHERAPY BOOKING PORTAL</p>
        </div>
    </div>
    <div class="nav-widgets">
        <div class="badge-chip"><span class="pulse-indicator"></span> Live System</div>
        <div class="badge-chip active"><span id="totalBookedCount">0</span> Booked (Selected Day)</div>
    </div>
</div>

<div class="main-container">
    <div class="controls-bar">
        <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search therapist..." onkeyup="filterTherapists()">
        </div>

        <div class="calendar-controls">
            <button class="btn-nav-date" onclick="changeDate(-1)">◄ Prev</button>
            <div class="date-picker-wrapper">
                <label for="dateSelect">📅</label>
                <input type="date" id="dateSelect" onchange="onDatePickerChange()">
            </div>
            <button class="btn-nav-date" onclick="goToToday()">Today</button>
            <button class="btn-nav-date" onclick="changeDate(1)">Next ►</button>
            <div class="date-display-badge" id="dateDisplayLabel"></div>
        </div>
    </div>

    <div id="app" class="therapist-grid"></div>
</div>

<div class="modal-backdrop" id="bookingModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3 class="modal-title">New Appointment</h3>
            <button class="btn-close" onclick="closeModal()">×</button>
        </div>
        <div class="form-field">
            <label>Selected Date</label>
            <input type="text" id="modalDateInfo" disabled style="background:#f1f5f9; font-weight:700; color:#0284c7;">
        </div>
        <div class="form-field">
            <label>Therapist & Time Slot</label>
            <input type="text" id="modalSlotInfo" disabled style="background:#f1f5f9; font-weight:700; color:#475569;">
        </div>
        <div class="form-field">
            <label>Patient Full Name *</label>
            <input type="text" id="patientNameInput" placeholder="e.g. Sarah Jenkins">
        </div>
        <div class="form-field">
            <label>Phone Number</label>
            <input type="text" id="patientPhoneInput" placeholder="e.g. +263 77 000 0000">
        </div>
        <div class="modal-footer">
            <button class="btn-action" style="background:#f1f5f9; color:#475569;" onclick="closeModal()">Cancel</button>
            <button class="btn-action btn-book" onclick="submitBooking()">Confirm Booking →</button>
        </div>
    </div>
</div>

<div class="toast-notification" id="toast">
    <span id="toastMsg">Notification message</span>
</div>

<script>
    localStorage.removeItem("saved_therapist_schedules");

    const therapists = [
        { name: "Chido", role: "Physiotherapist", slots: ["08:00 AM", "09:00 AM", "10:00 AM", "11:00 AM", "12:00 PM", "01:00 PM", "02:00 PM", "03:00 PM", "04:00 PM"] },
        { name: "Mispar", role: "Physiotherapist", slots: ["08:00 AM", "09:00 AM", "10:00 AM", "11:00 AM", "12:00 PM", "01:00 PM", "02:00 PM", "03:00 PM", "04:00 PM"] },
        { name: "Tinotenda", role: "Physiotherapist", slots: ["08:00 AM", "09:00 AM", "10:00 AM", "11:00 AM", "12:00 PM", "01:00 PM", "02:00 PM", "03:00 PM", "04:00 PM"] }
    ];

    let bookingsList = [];
    let currentBookingTarget = null;
    let selectedDate = new Date().toISOString().split('T')[0];

    function initCalendar() {
        const picker = document.getElementById("dateSelect");
        picker.value = selectedDate;
        updateDateLabel();
    }

    function updateDateLabel() {
        const dateObj = new Date(selectedDate + "T00:00:00");
        const options = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
        document.getElementById("dateDisplayLabel").textContent = dateObj.toLocaleDateString('en-US', options);
    }

    function onDatePickerChange() {
        const picker = document.getElementById("dateSelect");
        if (picker.value) {
            selectedDate = picker.value;
            updateDateLabel();
            renderColumns(getFilteredTherapists());
        }
    }

    function changeDate(days) {
        const current = new Date(selectedDate + "T00:00:00");
        current.setDate(current.getDate() + days);
        selectedDate = current.toISOString().split('T')[0];
        document.getElementById("dateSelect").value = selectedDate;
        updateDateLabel();
        renderColumns(getFilteredTherapists());
    }

    function goToToday() {
        selectedDate = new Date().toISOString().split('T')[0];
        document.getElementById("dateSelect").value = selectedDate;
        updateDateLabel();
        renderColumns(getFilteredTherapists());
    }

    function showToast(msg) {
        const toast = document.getElementById("toast");
        document.getElementById("toastMsg").textContent = msg;
        toast.style.display = "flex";
        setTimeout(() => toast.style.display = "none", 3000);
    }

    function openModal(practitioner, slot) {
        currentBookingTarget = { practitioner, slot, date: selectedDate };
        document.getElementById("modalDateInfo").value = document.getElementById("dateDisplayLabel").textContent;
        document.getElementById("modalSlotInfo").value = `${practitioner} — ${slot}`;
        document.getElementById("patientNameInput").value = "";
        document.getElementById("patientPhoneInput").value = "";
        document.getElementById("bookingModal").classList.add("active");
    }

    function closeModal() {
        document.getElementById("bookingModal").classList.remove("active");
        currentBookingTarget = null;
    }

    async function submitBooking() {
        if (!currentBookingTarget) return;
        const name = document.getElementById("patientNameInput").value.trim();
        const phone = document.getElementById("patientPhoneInput").value.trim();
        if (!name) return alert("Please enter the patient's full name.");

        const { practitioner, slot, date } = currentBookingTarget;
        const booking = { practitioner, therapist: practitioner, slot, time: slot, name, phone, date };
        
        bookingsList.push(booking);
        closeModal();
        renderColumns(getFilteredTherapists());
        showToast("Appointment confirmed for " + name);

        try {
            await fetch('/api/bookings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(booking)
            });
        } catch (err) { console.error(err); }
    }

    async function loadSlots() {
        try {
            const res = await fetch("/api/bookings");
            if (res.ok) {
                const data = await res.json();
                if (Array.isArray(data)) bookingsList = data;
            }
        } catch (e) {}
        renderColumns(getFilteredTherapists());
    }

    async function cancelBooking(practitioner, slot) {
        if (!confirm(`Cancel appointment on ${selectedDate} at ${slot} for ${practitioner}?`)) return;
        bookingsList = bookingsList.filter(b => !(
            (b.practitioner === practitioner || b.therapist === practitioner) &&
            (b.slot === slot || b.time === slot) &&
            (!b.date || b.date === selectedDate)
        ));
        renderColumns(getFilteredTherapists());
        showToast("Appointment canceled.");

        try {
            await fetch('/api/bookings/cancel', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ practitioner, slot, date: selectedDate })
            });
        } catch (err) { console.error(err); }
    }

    function getFilteredTherapists() {
        const query = document.getElementById("searchInput").value.toLowerCase();
        return therapists.filter(t => t.name.toLowerCase().includes(query) || t.role.toLowerCase().includes(query));
    }

    function filterTherapists() {
        renderColumns(getFilteredTherapists());
    }

    function renderColumns(data) {
        const dateBookings = bookingsList.filter(b => (!b.date || b.date === selectedDate));
        document.getElementById("totalBookedCount").textContent = dateBookings.length;

        const app = document.getElementById("app");
        app.innerHTML = "";
        data.forEach(p => {
            const therapistBookings = dateBookings.filter(b => (b.practitioner === p.name || b.therapist === p.name));
            const bookedCount = therapistBookings.length;
            const occupancyPct = Math.round((bookedCount / p.slots.length) * 100);

            const card = document.createElement("div");
            card.className = "therapist-card";
            
            let slotsHTML = "";
            p.slots.forEach(slot => {
                const booking = therapistBookings.find(b => (b.slot === slot || b.time === slot));
                if (booking) {
                    slotsHTML += `
                        <div class="slot-pill booked">
                            <div>
                                <div class="time-label">${slot}</div>
                                <div class="patient-card-info">
                                    <span class="patient-name-tag">👤 ${booking.name}</span>
                                    ${booking.phone ? ` • 📱 ${booking.phone}` : ''}
                                </div>
                            </div>
                            <button class="btn-action btn-cancel" onclick="cancelBooking('${p.name}', '${slot}')">Cancel</button>
                        </div>`;
                } else {
                    slotsHTML += `
                        <div class="slot-pill">
                            <div class="time-label">${slot}</div>
                            <button class="btn-action btn-book" onclick="openModal('${p.name}', '${slot}')">+ Book</button>
                        </div>`;
                }
            });

            card.innerHTML = `
                <div class="card-header">
                    <div class="header-top">
                        <div class="avatar-circle">${p.name.charAt(0)}</div>
                        <div class="profile-meta">
                            <h3>${p.name}</h3>
                            <p>${p.role}</p>
                        </div>
                    </div>
                    <div class="occupancy-bar-container">
                        <div class="occupancy-labels">
                            <span>Daily Capacity</span>
                            <span>${bookedCount} / ${p.slots.length} Booked (${occupancyPct}%)</span>
                        </div>
                        <div class="progress-track">
                            <div class="progress-fill" style="width: ${occupancyPct}%;"></div>
                        </div>
                    </div>
                </div>
                <div class="slots-body">${slotsHTML}</div>`;
            app.appendChild(card);
        });
    }

    initCalendar();
    loadSlots();
    setInterval(loadSlots, 3000);
</script>
</body>
</html>
